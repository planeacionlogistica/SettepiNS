<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auditoría Marathon · Visor de Unidades</title>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* (Mantengo exactamente los mismos estilos que tenías) */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f0f4fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 1400px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.07);
            padding: 28px 32px 40px;
        }
        h1 { font-weight: 700; font-size: 2rem; color: #0b1f3a; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
        h1 small { font-size: 0.85rem; font-weight: 400; color: #4a5f78; background: #e9eef5; padding: 4px 18px; border-radius: 40px; }
        .subhead { color: #2f4b6a; margin-bottom: 28px; padding-left: 18px; border-left: 5px solid #2a7de1; background: #f1f6fe; border-radius: 0 24px 24px 0; padding: 10px 20px; font-weight: 400; }
        .upload-area {
            background: #f7faff; border: 2px dashed #c8d6e8; border-radius: 30px; padding: 28px 20px 22px; text-align: center; margin-bottom: 28px; transition: 0.2s;
        }
        .upload-area:hover { border-color: #2a7de1; background: #f0f7ff; }
        .upload-area label {
            display: inline-block; background: #142b4a; color: white; padding: 12px 36px; border-radius: 60px; font-weight: 500; cursor: pointer; transition: 0.15s; font-size: 1rem; box-shadow: 0 4px 12px rgba(0, 20, 40, 0.12);
        }
        .upload-area label:hover { background: #0a1d33; transform: scale(1.02); }
        #file-input { display: none; }
        .file-status { margin-top: 14px; color: #1a3755; font-weight: 450; padding: 8px 16px; border-radius: 12px; }
        .file-status .ok { color: #1a7a3e; background: #e6f7ed; padding: 8px 16px; border-radius: 12px; display: inline-block; }
        .file-status .err { color: #b13e3e; background: #fde8e8; padding: 8px 16px; border-radius: 12px; display: inline-block; }
        .filter-section {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; background: #f2f7fe; padding: 14px 26px; border-radius: 60px; margin: 10px 0 30px;
        }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; margin-top: 16px;
        }
        .card {
            background: #ffffff; border-radius: 24px; padding: 16px 14px 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.02), 0 6px 20px rgba(0,20,40,0.04);
            border: 1px solid #e6ecf5; transition: all 0.15s ease; display: flex; flex-direction: column; align-items: center;
        }
        .card:hover { transform: translateY(-5px); border-color: #b3cced; box-shadow: 0 12px 32px rgba(27,67,120,0.08); }
        .card .id-label {
            font-weight: 700; font-size: 1.1rem; color: #0b2340; background: #e6effa; padding: 4px 18px; border-radius: 40px; margin-bottom: 12px; width: 100%; text-align: center;
        }
        .card .img-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; width: 100%; aspect-ratio: 1 / 0.9;
        }
        .card .img-grid .img-cell {
            background: #f2f6fc; border-radius: 12px; border: 1px solid #dfe8f2; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; min-height: 80px;
        }
        .card .img-grid .img-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card .img-grid .img-cell .empty-icon { color: #a3b8d0; font-size: 1.8rem; opacity: 0.6; }
        .card .field-labels {
            margin-top: 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; width: 100%;
        }
        .card .field-labels .badge {
            background: #eef3fa; padding: 2px 10px; border-radius: 40px; font-size: 0.55rem; font-weight: 600; color: #1f4168; border: 1px solid #d4e0ef;
        }
        .card .field-labels .badge.has-img { background: #d7e8fa; border-color: #8fb4df; }
        .no-data { grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: #4f6b88; background: #f8fcff; border-radius: 60px; border: 1px solid #e4ecf5; font-size: 1.1rem; }
        .footer-note { margin-top: 32px; text-align: right; font-size: 0.8rem; color: #6a829e; border-top: 1px solid #e2eaf3; padding-top: 18px; }
        .progress-bar { width: 100%; height: 6px; background: #e9eef5; border-radius: 4px; margin-top: 12px; overflow: hidden; display: none; }
        .progress-bar .fill { height: 100%; background: #2a7de1; width: 0%; transition: width 0.3s; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-truck-moving" style="color: #1a4b78;"></i> Auditoría Marathon <small>unidades</small></h1>
        <div class="subhead"><i class="fas fa-file-excel" style="margin-right: 10px;"></i> Carga el archivo <strong>Auditoria Marathon.xlsx</strong> para ver todas las imágenes</div>

        <div class="upload-area">
            <label for="file-input"><i class="fas fa-cloud-upload-alt"></i> Seleccionar archivo Excel</label>
            <input type="file" id="file-input" accept=".xlsx,.xls" />
            <div class="file-status" id="file-status"><i class="fas fa-info-circle"></i> Ningún archivo cargado</div>
            <div class="progress-bar" id="progress-bar"><div class="fill" id="progress-fill"></div></div>
        </div>

        <div class="filter-section">
            <label for="unit-select"><i class="fas fa-filter"></i> Filtrar por unidad:</label>
            <select id="unit-select"><option value="all">Todas las unidades</option></select>
            <span class="count-badge" id="unit-count"><i class="far fa-image"></i> 0 imágenes</span>
        </div>

        <div class="grid" id="cards-grid">
            <div class="no-data"><i class="fas fa-cloud-upload-alt" style="font-size: 2.2rem; display: block; margin-bottom: 12px;"></i> Carga el archivo Excel para ver las unidades</div>
        </div>
        <div class="footer-note"><i class="fas fa-th"></i> 6 imágenes por unidad (Frente · Trasera · Interior · Botiquín · Extintor · Cortinas)</div>
    </div>

    <script>
        (function() {
            'use strict';

            let rawData = [];
            let allIds = [];
            const selectEl = document.getElementById('unit-select');
            const gridEl = document.getElementById('cards-grid');
            const fileInput = document.getElementById('file-input');
            const fileStatus = document.getElementById('file-status');
            const unitCount = document.getElementById('unit-count');
            const progressBar = document.getElementById('progress-bar');
            const progressFill = document.getElementById('progress-fill');

            const FIELDS = ['Frente', 'Trasera', 'Interior', 'Botiquin', 'Extintor', 'Cortinas'];
            const FIELD_ICONS = { 'Frente': 'fa-car-side', 'Trasera': 'fa-car-rear', 'Interior': 'fa-chair', 'Botiquin': 'fa-briefcase-medical', 'Extintor': 'fa-fire-extinguisher', 'Cortinas': 'fa-wind' };

            async function processExcelWithExcelJS(arrayBuffer) {
                try {
                    progressBar.style.display = 'block';
                    progressFill.style.width = '20%';

                    const workbook = new ExcelJS.Workbook();
                    await workbook.xlsx.load(arrayBuffer);

                    progressFill.style.width = '40%';
                    const worksheet = workbook.getWorksheet(1);

                    // === MEJORA PRINCIPAL: Extracción robusta de imágenes ===
                    const imagesMap = new Map();
                    if (worksheet.getImages) {
                        const images = worksheet.getImages();
                        console.log(`📸 ${images.length} imágenes detectadas en el Excel`);

                        for (const img of images) {
                            try {
                                const imageId = img.imageId;
                                const media = workbook.getImage(imageId);
                                if (!media || !media.buffer) continue;

                                const range = img.range;
                                if (!range || !range.tl) continue;

                                // Convertir buffer a base64
                                const base64 = btoa(String.fromCharCode(...new Uint8Array(media.buffer)));
                                const dataUrl = `data:image/${media.extension || 'png'};base64,${base64}`;

                                const row = range.tl.row + 1;   // ExcelJS usa 0-based
                                const col = range.tl.col + 1;
                                const key = `${row},${col}`;
                                imagesMap.set(key, dataUrl);
                            } catch (e) { console.warn('Error procesando imagen:', e); }
                        }
                    }

                    progressFill.style.width = '70%';

                    // Leer datos
                    const rows = worksheet.getRows(1, worksheet.rowCount);
                    const headerRow = rows[0];
                    const headers = [];
                    for (let i = 1; i <= headerRow.cellCount; i++) {
                        headers.push((headerRow.getCell(i).text || '').trim());
                    }

                    const idIndex = headers.findIndex(h => h.toLowerCase().includes('id'));
                    if (idIndex === -1) throw new Error('No se encontró columna ID');

                    const fieldIndices = {};
                    FIELDS.forEach(f => {
                        const idx = headers.findIndex(h => h.toLowerCase() === f.toLowerCase());
                        if (idx !== -1) fieldIndices[f] = idx;
                    });

                    rawData = [];
                    const idsSet = new Set();

                    for (let r = 1; r < rows.length; r++) {
                        const row = rows[r];
                        if (!row) continue;
                        const idCell = row.getCell(idIndex + 1);
                        const idVal = (idCell.text || '').trim();
                        if (!idVal) continue;

                        const entry = { Id: idVal };

                        for (const field of FIELDS) {
                            const colIdx = fieldIndices[field];
                            if (colIdx === undefined) {
                                entry[field] = '';
                                continue;
                            }
                            const cellCol = colIdx + 1;
                            const key = `${r + 1},${cellCol}`;

                            if (imagesMap.has(key)) {
                                entry[field] = imagesMap.get(key);
                            } else {
                                entry[field] = (row.getCell(cellCol).text || '').trim();
                            }
                        }
                        rawData.push(entry);
                        idsSet.add(idVal);
                    }

                    progressFill.style.width = '100%';

                    allIds = Array.from(idsSet).sort((a,b) => Number(a)-Number(b));
                    populateSelect(allIds);
                    selectEl.value = 'all';
                    renderGrid('all');

                    const totalImages = rawData.reduce((sum, row) => {
                        return sum + FIELDS.filter(f => row[f] && row[f].startsWith('data:image')).length;
                    }, 0);

                    fileStatus.innerHTML = `<span class="ok"><i class="fas fa-check-circle"></i> Cargado: ${rawData.length} unidades · ${totalImages} imágenes</span>`;

                    setTimeout(() => { progressBar.style.display = 'none'; progressFill.style.width = '0%'; }, 800);

                } catch (error) {
                    console.error(error);
                    fileStatus.innerHTML = `<span class="err"><i class="fas fa-times-circle"></i> Error: ${error.message}</span>`;
                    progressBar.style.display = 'none';
                }
            }

            function renderGrid(filterId) { /* igual que antes, lo mantengo igual */ 
                gridEl.innerHTML = '';
                let filtered = filterId === 'all' ? rawData : rawData.filter(row => String(row.Id) === String(filterId));
                if (filtered.length === 0) {
                    gridEl.innerHTML = `<div class="no-data">No hay datos para este filtro</div>`;
                    return;
                }

                for (const row of filtered) {
                    const card = document.createElement('div'); card.className = 'card';
                    card.innerHTML = `<div class="id-label">#${row.Id}</div>`;
                    const imgGrid = document.createElement('div'); imgGrid.className = 'img-grid';

                    for (const field of FIELDS) {
                        const cell = document.createElement('div'); cell.className = 'img-cell';
                        const val = row[field] || '';

                        if (val.startsWith('data:image')) {
                            const img = document.createElement('img');
                            img.src = val;
                            img.alt = field;
                            cell.appendChild(img);
                        } else {
                            const icon = document.createElement('i');
                            icon.className = `fas ${FIELD_ICONS[field] || 'fa-image'} empty-icon`;
                            cell.appendChild(icon);
                        }

                        const label = document.createElement('span');
                        label.className = 'field-label-mini';
                        label.textContent = field.substring(0,3);
                        cell.appendChild(label);
                        imgGrid.appendChild(cell);
                    }
                    card.appendChild(imgGrid);

                    const labelsDiv = document.createElement('div'); labelsDiv.className = 'field-labels';
                    for (const field of FIELDS) {
                        const badge = document.createElement('span');
                        badge.className = 'badge' + ((row[field] || '').startsWith('data:image') ? ' has-img' : '');
                        badge.innerHTML = `<i class="fas ${FIELD_ICONS[field]}"></i> ${field}`;
                        labelsDiv.appendChild(badge);
                    }
                    card.appendChild(labelsDiv);
                    gridEl.appendChild(card);
                }

                const total = rawData.reduce((sum, r) => sum + FIELDS.filter(f => (r[f] || '').startsWith('data:image')).length, 0);
                unitCount.innerHTML = `<i class="far fa-image"></i> ${total} imágenes`;
            }

            function populateSelect(ids) {
                selectEl.innerHTML = '<option value="all">Todas las unidades</option>';
                ids.forEach(id => {
                    const opt = document.createElement('option');
                    opt.value = id;
                    opt.textContent = `Unidad ${id}`;
                    selectEl.appendChild(opt);
                });
            }

            fileInput.addEventListener('change', e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => processExcelWithExcelJS(ev.target.result);
                reader.readAsArrayBuffer(file);
            });

            selectEl.addEventListener('change', () => renderGrid(selectEl.value));

            // Drag & drop
            const uploadArea = document.querySelector('.upload-area');
            uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#2a7de1'; });
            uploadArea.addEventListener('dragleave', () => uploadArea.style.borderColor = '#c8d6e8');
            uploadArea.addEventListener('drop', e => {
                e.preventDefault();
                uploadArea.style.borderColor = '#c8d6e8';
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    fileInput.dispatchEvent(new Event('change'));
                }
            });
        })();
    </script>
</body>
</html>
