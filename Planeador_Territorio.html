<!DOCTYPE html>

<style>

<body>
<div class="app">
<header>
  <h1>Optimizador de Operadores · Settepi (Rutas Reales + Tiempos)</h1>
  <div class="kpis">
    <div class="kpi"><div class="kpi-label">Km Actual</div><div class="kpi-val" id="kpi-actual">—</div></div>
    <div class="kpi"><div class="kpi-label">Km Optimizado</div><div class="kpi-val" id="kpi-opt">—</div></div>
    <div class="kpi"><div class="kpi-label">Ahorro (km)</div><div class="kpi-val" id="kpi-ahorro">— <small id="kpi-pct"></small></div></div>
    <div class="kpi"><div class="kpi-label">Ahorro (min)</div><div class="kpi-val" id="kpi-tiempo">—</div></div>
    <div class="kpi"><div class="kpi-label">Swaps</div><div class="kpi-val" id="kpi-swaps">—</div></div>
  </div>
</header>
<main>
<aside>
  <div class="filtros">
    <button class="btn-upload" id="btn-upload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14"><path d="M12 4v12M5 11l7-7 7 7M5 20h14" stroke-linecap="round"/></svg>
      Cargar Excel
    </button>
    <input type="file" id="file-input" accept=".xlsx,.xlsm" style="display:none">
    <div class="archivo-info" id="archivo-info">Datos: Asignacion_Garcia.xlsx (ejemplo)</div>
    
    <h3>Filtros</h3>
    <div class="filtro-row">
      <label>UDN</label>
      <select id="f-udn"><option value="">Todas las UDN</option></select>
    </div>
    <div class="filtro-row">
      <label>Rango de ahorro (km)</label>
      <select id="f-rango">
        <option value="0">Todos los ahorros</option>
        <option value="5">≥ 5 km</option>
        <option value="10">≥ 10 km</option>
        <option value="13" selected>≥ 13 km (recomendado)</option>
        <option value="15">≥ 15 km</option>
        <option value="20">≥ 20 km</option>
        <option value="30">≥ 30 km</option>
        <option value="50">≥ 50 km</option>
      </select>
    </div>
    <label class="toggle"><input type="checkbox" id="f-mismocliente" checked> Solo mismo cliente</label>
    <label class="toggle" id="lbl-mismaudn" style="display:none"><input type="checkbox" id="f-mismaudn" checked> Solo misma UDN</label>
    <button class="btn-primary" id="btn-recalc">Recalcular (con rutas reales)</button>
    <button class="btn-secondary" id="btn-interudn" style="display:none">Buscar intercambios entre UDNs</button>
    <div class="rango-info" id="rango-info"></div>
  </div>
  <div class="lista-header">
    <h3>Intercambios sugeridos</h3>
    <span class="lista-count" id="lista-count"></span>
  </div>
  <div class="lista-swaps" id="lista">
    <div class="loading"><div class="spinner"></div>Iniciando...</div>
  </div>
</aside>
<div class="mapa-wrap">
  <div id="map"></div>
  <div class="legenda" id="legenda"></div>
</div>
</main>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modal-bd">
  <div class="modal">
    <div class="modal-head">
      <div class="rank-big" id="modal-rank">#1</div>
      <div class="titulo">
        <div class="udns-row" id="modal-udns"></div>
        <div class="clientes-row" id="modal-clientes"></div>
      </div>
      <div class="ahorro-big" id="modal-ahorro"></div>
      <div class="tiempo-big" id="modal-tiempo"></div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-tabla" id="modal-tabla"></div>
      <div class="modal-mapa-wrap"><div id="modal-map"></div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const URL_OSRM = 'https://router.project-osrm.org/route/v1/driving/';
const CACHE_RUTAS = new Map();
let DATOS = null;
let mapa, layerOps, layerPIs, layerLineas, layerSeleccion;
let modalMapa = null, modalLayer = null;
let swapsActuales = [], swapSeleccionado = null;
let kmTotalActual = 0, tiempoTotalActual = 0;

async function obtenerRuta(lon1, lat1, lon2, lat2) {
  const key = `${lat1},${lon1}|${lat2},${lon2}`;
  if (CACHE_RUTAS.has(key)) return CACHE_RUTAS.get(key);
  const url = `${URL_OSRM}${lon1},${lat1};${lon2},${lat2}?overview=false&geometries=polyline`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
      const route = data.routes[0];
      const resultado = { km: route.distance / 1000, minutos: route.duration / 60 };
      CACHE_RUTAS.set(key, resultado);
      return resultado;
    }
  } catch(e) { console.warn('Error OSRM:', e); }
  return null;
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371, toRad=d=>d*Math.PI/180;
  const dlat=toRad(lat2-lat1), dlon=toRad(lon2-lon1);
  const a=Math.sin(dlat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dlon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function fmtNum(n, dec=1){return (n||0).toLocaleString('es-MX',{maximumFractionDigits:dec})}
function fmtTiempo(min){return min>=60?`${Math.floor(min/60)}h ${Math.round(min%60)}min`:`${Math.round(min)} min`}

function colorUDN(udn){
  const u = (udn||'').toLowerCase();
  if(u.includes('garcia')) return '#ea580c';
  if(u.includes('lipu')) return '#16a34a';
  if(u.includes('monterrey')) return '#1e3a8a';
  return '#6b7280';
}
function udnClass(udn){
  const u = (udn||'').toLowerCase();
  if(u.includes('garcia')) return 'garcia';
  if(u.includes('lipu')) return 'lipu';
  if(u.includes('monterrey')) return 'monterrey';
  return 'otra';
}
function udnTag(udn){return `<span class="udn-tag ${udnClass(udn)}">${escapeHTML(udn)}</span>`;}
function escapeHTML(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showError(msg){console.error(msg);document.getElementById('lista').innerHTML=`<div class="error-msg"><b>Error:</b>${escapeHTML(msg)}</div>`;}
function showToast(msg, ms=5000){
  const t = document.getElementById('toast');t.innerHTML = msg;t.classList.add('show');
  clearTimeout(t._timer);t._timer = setTimeout(()=>t.classList.remove('show'), ms);
}

function initMapa(){
  mapa = L.map('map',{zoomControl:true}).setView([25.78,-100.45],11);
  const calles = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd', attribution:'© OSM'});
  calles.addTo(mapa);
  layerLineas = L.layerGroup().addTo(mapa);
  layerOps = L.layerGroup().addTo(mapa);
  layerPIs = L.layerGroup().addTo(mapa);
  layerSeleccion = L.layerGroup().addTo(mapa);
}

function pintarMapa(){
  layerOps.clearLayers();layerPIs.clearLayers();layerLineas.clearLayers();
  if(!DATOS) return;
  const ops = DATOS.ops;
  ops.forEach(o=>{
    const color = colorUDN(o.udn);
    L.circleMarker([o.olat,o.olon],{radius:5,color:'#fff',weight:1.2,fillColor:color,fillOpacity:0.95})
      .bindTooltip(`<b>${escapeHTML(o.nombre||o.nom)}</b><br>${escapeHTML(o.udn)}`,{direction:'top'}).addTo(layerOps);
    L.circleMarker([o.plat,o.plon],{radius:4,color:color,weight:2,fillColor:'#fff',fillOpacity:1})
      .bindTooltip(`${escapeHTML(o.ruta)}<br>${escapeHTML(o.cliente_short||o.cliente)}`,{direction:'top'}).addTo(layerPIs);
    L.polyline([[o.olat,o.olon],[o.plat,o.plon]],{color,weight:1.5,opacity:0.4}).addTo(layerLineas);
  });
}

function pintarSwapMapaPrincipal(idx){
  layerSeleccion.clearLayers();
  const s = swapsActuales[idx];
  if(!s || !s.rutasReales) return;
  const {A,B, rutasReales} = s;
  L.polyline([[A.olat,A.olon],[A.plat,A.plon]],{color:'#dc2626',weight:3,dashArray:'6,6',opacity:0.9}).addTo(layerSeleccion);
  L.polyline([[B.olat,B.olon],[B.plat,B.plon]],{color:'#dc2626',weight:3,dashArray:'6,6',opacity:0.9}).addTo(layerSeleccion);
  if(rutasReales.A_B) L.polyline([[A.olat,A.olon],[B.plat,B.plon]],{color:'#65a30d',weight:4,opacity:0.95}).addTo(layerSeleccion);
  if(rutasReales.B_A) L.polyline([[B.olat,B.olon],[A.plat,A.plon]],{color:'#65a30d',weight:4,opacity:0.95}).addTo(layerSeleccion);
}

async function calcularSwaps(){
  const f = getFiltros();
  let ops = DATOS.ops.filter(o=>!(f.udn && o.udn!==f.udn));
  
  const grupos = {};
  ops.forEach(o=>{
    let k = '';
    if(f.mismaUDN) k += o.udn;
    if(f.mismoCliente) k += '|' + o.cliente;
    if(!grupos[k]) grupos[k] = [];
    grupos[k].push(o);
  });
  
  const candidatos = [];
  let kmActualTotal = 0, tiempoActualTotal = 0;
  
  // Primero calcular km y tiempos actuales (lineal, pero con tiempo lineal aproximado)
  for(const o of ops){
    const km = haversine(o.olat,o.olon,o.plat,o.plon);
    o._kmAct = km;
    o._tiempoAct = km * 2.5; // tiempo lineal aproximado (min) suponiendo 40km/h
    kmActualTotal += km;
    tiempoActualActual += o._tiempoAct;
  }
  
  for(const g of Object.values(grupos)){
    for(let i=0;i<g.length;i++){
      for(let j=i+1;j<g.length;j++){
        const A=g[i], B=g[j];
        if(A.ruta===B.ruta && A.cliente===B.cliente) continue;
        
        const rutaAB = await obtenerRuta(A.olon, A.olat, B.plon, B.plat);
        const rutaBA = await obtenerRuta(B.olon, B.olat, A.plon, A.plat);
        
        if(!rutaAB || !rutaBA) continue;
        
        const kmA_new = rutaAB.km;
        const kmB_new = rutaBA.km;
        const tiempoA_new = rutaAB.minutos;
        const tiempoB_new = rutaBA.minutos;
        const ahorroKm = (A._kmAct + B._kmAct) - (kmA_new + kmB_new);
        const ahorroMin = (A._tiempoAct + B._tiempoAct) - (tiempoA_new + tiempoB_new);
        
        if(ahorroKm >= f.minAhorro){
          candidatos.push({
            A, B,
            kmA_new, kmB_new,
            tiempoA_new, tiempoB_new,
            ahorroKm, ahorroMin,
            rutasReales: { A_B: rutaAB, B_A: rutaBA }
          });
        }
        
        await new Promise(r => setTimeout(r, 50)); // rate limiting
      }
    }
  }
  
  candidatos.sort((a,b)=>b.ahorroKm - a.ahorroKm);
  const usados = new Set();
  const swaps = [];
  for(const c of candidatos){
    if(usados.has(c.A.i)||usados.has(c.B.i)) continue;
    usados.add(c.A.i); usados.add(c.B.i);
    swaps.push(c);
  }
  
  swapsActuales = swaps;
  const kmAhorrado = swaps.reduce((s,c)=>s+c.ahorroKm,0);
  const minAhorrado = swaps.reduce((s,c)=>s+c.ahorroMin,0);
  
  document.getElementById('kpi-actual').textContent = fmtNum(kmActualTotal)+' km';
  document.getElementById('kpi-opt').textContent = fmtNum(kmActualTotal-kmAhorrado)+' km';
  document.getElementById('kpi-ahorro').innerHTML = fmtNum(kmAhorrado)+' km <small>'+(kmActualTotal?fmtNum(100*kmAhorrado/kmActualTotal)+'%':'')+'</small>';
  document.getElementById('kpi-tiempo').innerHTML = fmtTiempo(minAhorrado);
  document.getElementById('kpi-swaps').textContent = swaps.length;
  renderLista();
}

function getFiltros(){
  const rangoSelect = document.getElementById('f-rango').value;
  let minAhorro = parseInt(rangoSelect) || 0;
  if(minAhorro === 0) minAhorro = 0;
  return {
    udn: document.getElementById('f-udn').value,
    minAhorro: minAhorro,
    mismoCliente: document.getElementById('f-mismocliente').checked,
    mismaUDN: document.getElementById('f-mismaudn').checked,
  };
}

function renderLista(){
  const cont = document.getElementById('lista');
  document.getElementById('lista-count').textContent = swapsActuales.length+' opciones';
  if(swapsActuales.length===0){
    cont.innerHTML = `<div class="empty"><b>Sin intercambios con ahorro ≥ ${getFiltros().minAhorro} km</b><br>Prueba relajar el rango o cargar más datos.</div>`;
    return;
  }
  let html = '';
  swapsActuales.slice(0,300).forEach((s,idx)=>{
    html += `
      <div class="swap-item" data-idx="${idx}">
        <div class="swap-row1">
          <span class="swap-rank">#${idx+1}</span>
          <span class="swap-udns">${udnTag(s.A.udn)}<span class="sep">↔</span>${udnTag(s.B.udn)}</span>
          <span class="swap-ahorro">-${s.ahorroKm.toFixed(1)} km</span>
          <span class="swap-tiempo">⏱ -${fmtTiempo(s.ahorroMin)}</span>
        </div>
        <div class="swap-row2">
          <span class="cliente-pill">${escapeHTML(s.A.cliente_short||s.A.cliente)}</span>
          <span>↔</span>
          <span class="cliente-pill">${escapeHTML(s.B.cliente_short||s.B.cliente)}</span>
        </div>
      </div>`;
  });
  cont.innerHTML = html;
  cont.querySelectorAll('.swap-item').forEach(el=>{
    el.addEventListener('click',()=>abrirModal(parseInt(el.dataset.idx)));
  });
}

function abrirModal(idx){
  const s = swapsActuales[idx];
  if(!s) return;
  swapSeleccionado = s;
  const {A,B, kmA_new, kmB_new, tiempoA_new, tiempoB_new, ahorroKm, ahorroMin, rutasReales} = s;
  
  document.querySelectorAll('.swap-item').forEach(el=>el.classList.remove('active'));
  document.querySelector(`.swap-item[data-idx="${idx}"]`)?.classList.add('active');
  pintarSwapMapaPrincipal(idx);
  
  const pct = ((ahorroKm)/(A._kmAct+B._kmAct)*100);
  document.getElementById('modal-rank').textContent = '#'+(idx+1);
  document.getElementById('modal-udns').innerHTML = `${udnTag(A.udn)} ↔ ${udnTag(B.udn)}`;
  document.getElementById('modal-clientes').innerHTML = `<b>${escapeHTML(A.cliente_short||A.cliente)}</b> ↔ <b>${escapeHTML(B.cliente_short||B.cliente)}</b>`;
  document.getElementById('modal-ahorro').innerHTML = `-${ahorroKm.toFixed(1)} km <small>${pct.toFixed(0)}%</small>`;
  document.getElementById('modal-tiempo').innerHTML = `⏱ -${fmtTiempo(ahorroMin)}`;
  
  const cA = colorUDN(A.udn), cB = colorUDN(B.udn);
  const pctA = A._kmAct>0?Math.round((A._kmAct-kmA_new)/A._kmAct*100):0;
  const pctB = B._kmAct>0?Math.round((B._kmAct-kmB_new)/B._kmAct*100):0;
  
  document.getElementById('modal-tabla').innerHTML = `
    <table class="tabla-comp">
      <thead><tr><th class="col-campo">Campo</th><th class="col-A" style="background:${cA}">A</th><th class="col-B" style="background:${cB}">B</th></tr></thead>
      <tbody>
        <tr><td class="campo">Operador</td><td class="val nombre">${escapeHTML(A.nombre||A.nom)}</td><td class="val nombre">${escapeHTML(B.nombre||B.nom)}</td></tr>
        <tr><td class="campo">UDN</td><td>${escapeHTML(A.udn)}</td><td>${escapeHTML(B.udn)}</td></tr>
        <tr><td class="campo">Cliente</td><td>${escapeHTML(A.cliente)}</td><td>${escapeHTML(B.cliente)}</td></tr>
        <tr><td class="campo">Ruta actual</td><td class="ruta-actual">${escapeHTML(A.ruta)}</td><td class="ruta-actual">${escapeHTML(B.ruta)}</td></tr>
        <tr><td class="campo">Ruta propuesta</td><td class="ruta-nueva">${escapeHTML(B.ruta)}</td><td class="ruta-nueva">${escapeHTML(A.ruta)}</td></tr>
        <tr><td class="campo">Km actuales</td><td class="km-actual">${A._kmAct.toFixed(1)} km</td><td class="km-actual">${B._kmAct.toFixed(1)} km</td></tr>
        <tr><td class="campo">Km propuestos</td><td class="km-nuevo">${kmA_new.toFixed(1)} km</td><td class="km-nuevo">${kmB_new.toFixed(1)} km</td></tr>
        <tr><td class="campo">Reducción km</td><td class="delta">-${(A._kmAct-kmA_new).toFixed(1)} km (${pctA}%)</td><td class="delta">-${(B._kmAct-kmB_new).toFixed(1)} km (${pctB}%)</td></tr>
        <tr><td class="campo">Tiempo actual</td><td>${fmtTiempo(A._tiempoAct)}</td><td>${fmtTiempo(B._tiempoAct)}</td></tr>
        <tr><td class="campo">Tiempo propuesto</td><td>${fmtTiempo(tiempoA_new)}</td><td>${fmtTiempo(tiempoB_new)}</td></tr>
      </tbody>
    </table>
    <div class="modal-resumen">
      <h4>Resumen del intercambio</h4>
      <div class="resumen-row"><span>Km actuales (A+B)</span><b>${(A._kmAct+B._kmAct).toFixed(1)} km</b></div>
      <div class="resumen-row"><span>Km propuestos (A+B)</span><b>${(kmA_new+kmB_new).toFixed(1)} km</b></div>
      <div class="resumen-row"><span>Tiempo actual (A+B)</span><b>${fmtTiempo(A._tiempoAct+B._tiempoAct)}</b></div>
      <div class="resumen-row"><span>Tiempo propuesto (A+B)</span><b>${fmtTiempo(tiempoA_new+tiempoB_new)}</b></div>
      <div class="resumen-row total"><span>AHORRO TOTAL</span><b>-${ahorroKm.toFixed(1)} km · -${fmtTiempo(ahorroMin)}</b></div>
    </div>
  `;
  
  document.getElementById('modal-bd').classList.add('show');
  
  setTimeout(()=>{
    if(!modalMapa){
      modalMapa = L.map('modal-map',{zoomControl:true});
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd'}).addTo(modalMapa);
      modalLayer = L.layerGroup().addTo(modalMapa);
    }
    modalMapa.invalidateSize();
    pintarMapaModal(s);
  }, 100);
}

function pintarMapaModal(s){
  modalLayer.clearLayers();
  const {A,B, rutasReales} = s;
  const colorA = colorUDN(A.udn), colorB = colorUDN(B.udn);
  
  L.polyline([[A.olat,A.olon],[A.plat,A.plon]],{color:'#dc2626',weight:3,dashArray:'8,6'}).addTo(modalLayer);
  L.polyline([[B.olat,B.olon],[B.plat,B.plon]],{color:'#dc2626',weight:3,dashArray:'8,6'}).addTo(modalLayer);
  if(rutasReales.A_B) L.polyline([[A.olat,A.olon],[B.plat,B.plon]],{color:'#65a30d',weight:5}).addTo(modalLayer);
  if(rutasReales.B_A) L.polyline([[B.olat,B.olon],[A.plat,A.plon]],{color:'#65a30d',weight:5}).addTo(modalLayer);
  
  L.marker([A.olat,A.olon],{icon:L.divIcon({html:`<div style="background:${colorA};border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;border:2px solid white;">A</div>`,iconSize:[32,32],className:''})}).bindPopup(`Hogar A<br>${escapeHTML(A.nombre||A.nom)}`).addTo(modalLayer);
  L.marker([B.olat,B.olon],{icon:L.divIcon({html:`<div style="background:${colorB};border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;border:2px solid white;">B</div>`,iconSize:[32,32],className:''})}).bindPopup(`Hogar B<br>${escapeHTML(B.nombre||B.nom)}`).addTo(modalLayer);
  L.marker([A.plat,A.plon],{icon:L.divIcon({html:`<div style="background:#374151;border-radius:4px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;">A</div>`,iconSize:[28,28],className:''})}).bindPopup(`Ruta A: ${escapeHTML(A.ruta)}`).addTo(modalLayer);
  L.marker([B.plat,B.plon],{icon:L.divIcon({html:`<div style="background:#374151;border-radius:4px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:white;font-size:12px;">B</div>`,iconSize:[28,28],className:''})}).bindPopup(`Ruta B: ${escapeHTML(B.ruta)}`).addTo(modalLayer);
  
  const bounds = L.latLngBounds([[A.olat,A.olon],[A.plat,A.plon],[B.olat,B.olon],[B.plat,B.plon]]);
  modalMapa.fitBounds(bounds,{padding:[60,60]});
}

function cerrarModal(){ document.getElementById('modal-bd').classList.remove('show'); }

async function refresh(){
  document.getElementById('lista').innerHTML='<div class="loading"><div class="spinner"></div>Calculando rutas reales...<br><small>Puede tomar unos segundos</small></div>';
  layerSeleccion?.clearLayers();
  pintarMapa();
  await calcularSwaps();
}

function poblarFiltros(){
  const fUDN = document.getElementById('f-udn');
  fUDN.innerHTML = '<option value="">Todas las UDN</option>';
  (DATOS.udns||[]).forEach(u=>{
    const opt = document.createElement('option');opt.value=u;opt.textContent=u;fUDN.appendChild(opt);
  });
  const multiUDN = (DATOS.udns||[]).length > 1;
  document.getElementById('lbl-mismaudn').style.display = multiUDN ? 'flex' : 'none';
  document.getElementById('btn-interudn').style.display = multiUDN ? 'block' : 'none';
}

async function cargarArchivo(file){
  if(typeof XLSX === 'undefined'){showError('No se cargó XLSX.');return;}
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      let ws = null;
      for(const sn of wb.SheetNames){
        const tmp = XLSX.utils.sheet_to_json(wb.Sheets[sn], {defval:null});
        if(tmp.length>0){
          const cols = Object.keys(tmp[0]);
          if(cols.includes('UDN')&&cols.includes('Operadores')&&cols.includes('Lat op')&&cols.includes('Long Op')&&cols.includes('Lat Pi')&&cols.includes('Long Pi')){
            ws = wb.Sheets[sn]; break;
          }
        }
      }
      if(!ws){showError('Formato no reconocido');return;}
      const rows = XLSX.utils.sheet_to_json(ws, {defval:null});
      const ops = [];
      rows.forEach((r,idx)=>{
        const olat=parseFloat(r['Lat op']), olon=parseFloat(r['Long Op']);
        const plat=parseFloat(r['Lat Pi']), plon=parseFloat(r['Long Pi']);
        if(isNaN(olat)||isNaN(olon)||isNaN(plat)||isNaN(plon)||!r['UDN']||!r['Operadores']) return;
        const rawOp = String(r['Operadores']).trim();
        const partes = rawOp.split('-');
        const nom = partes.length>1 ? partes[0].trim() : '';
        const nombre = partes.length>1 ? partes.slice(1).join('-').trim() : rawOp;
        const rutaRaw = String(r['Ruta asignada']||'').trim();
        const rutaParts = rutaRaw.split('-');
        const cliente = rutaParts.length>=2 ? (rutaParts[0]+'-'+rutaParts[1]).trim() : rutaRaw;
        const cliente_short = rutaParts.length>=2 ? rutaParts[1].trim() : rutaRaw;
        const ruta = rutaParts.length>2 ? rutaParts.slice(2).join('-').trim() : rutaRaw;
        ops.push({i:idx,nom,nombre,udn:String(r['UDN']),cliente,cliente_short,ruta,olat:+olat.toFixed(6),olon:+olon.toFixed(6),plat:+plat.toFixed(6),plon:+plon.toFixed(6)});
      });
      if(ops.length===0){showError('No se encontraron datos');return;}
      const udns = [...new Set(ops.map(o=>o.udn))].sort();
      const clientes_por_udn = {};
      udns.forEach(u=>{clientes_por_udn[u]=[...new Set(ops.filter(o=>o.udn===u).map(o=>o.cliente))].sort();});
      DATOS = {ops,udns,clientes_por_udn};
      document.getElementById('archivo-info').textContent = `Datos: ${file.name} · ${ops.length} ops`;
      showToast(`✅ Cargados ${ops.length} operadores en ${udns.length} UDN(s)`,4000);
      poblarFiltros();
      refresh();
    }catch(err){showError('Error: '+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

async function init(){
  try{
    initMapa();
    cargarDatosEjemplo();
    document.getElementById('btn-recalc').addEventListener('click',refresh);
    document.getElementById('btn-upload').addEventListener('click',()=>document.getElementById('file-input').click());
    document.getElementById('file-input').addEventListener('change',(e)=>{if(e.target.files[0])cargarArchivo(e.target.files[0]);e.target.value='';});
    document.getElementById('btn-interudn').addEventListener('click',async()=>{
      document.getElementById('f-mismocliente').checked=false;
      document.getElementById('f-mismaudn').checked=false;
      document.getElementById('f-udn').value='';
      showToast('Modo inter-UDN activado',5000);
      await refresh();
    });
    ['f-udn','f-mismocliente','f-mismaudn','f-rango'].forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('change',refresh);
    });
    document.getElementById('modal-close').addEventListener('click',cerrarModal);
    document.getElementById('modal-bd').addEventListener('click',(e)=>{if(e.target.id==='modal-bd') cerrarModal();});
    document.addEventListener('keydown',(e)=>{if(e.key==='Escape') cerrarModal();});
  }catch(e){showError('Error: '+e.message);}
}
window.addEventListener('DOMContentLoaded', init);
