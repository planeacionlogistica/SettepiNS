.error-msg{color:#991b1b;background:#fee2e2;padding:12px;margin:10px;border-radius:5px}

<body>
<div class="app">
<header>
  <h1>🚛 Optimizador de Operadores · Settepi (Rutas + Tiempos)</h1>
  <div class="kpis">
    <div class="kpi"><div class="kpi-label">Km Actual</div><div class="kpi-val" id="kpi-actual">—</div></div>
    <div class="kpi"><div class="kpi-label">Km Optimizado</div><div class="kpi-val" id="kpi-opt">—</div></div>
    <div class="kpi"><div class="kpi-label">⏱ Ahorro min</div><div class="kpi-val" id="kpi-tiempo">—</div></div>
    <div class="kpi"><div class="kpi-label">Swaps</div><div class="kpi-val" id="kpi-swaps">—</div></div>
  </div>
</header>
<main>
<aside>
  <div class="filtros">
    <button class="btn-upload" id="btn-upload">📂 Cargar Excel</button>
    <input type="file" id="file-input" accept=".xlsx,.xlsm" style="display:none">
    <div class="archivo-info" id="archivo-info" style="font-size:10px;color:#6b7280;margin-bottom:8px">Datos de ejemplo precargados</div>
    <div class="filtro-row">

        <option value="0">Todos</option>
        <option value="5">≥ 5 km</option>
        <option value="10">≥ 10 km</option>
        <option value="13" selected>≥ 13 km</option>
        <option value="20">≥ 20 km</option>
        <option value="30">≥ 30 km</option>
      </select>
    </div>
    <label class="toggle"><input type="checkbox" id="f-mismocliente" checked> 🔄 Solo mismo cliente</label>
    <button class="btn-primary" id="btn-recalc">🔄 Recalcular rutas reales</button>
    <div class="progress-bar" id="progress-bar" style="display:none"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

</div>

<div class="modal-backdrop" id="modal-bd"><div class="modal"><div class="modal-head"><div id="modal-title">Intercambio</div><button class="modal-close" id="modal-close">✕</button></div><div class="modal-body"><div class="modal-tabla" id="modal-tabla"></div><div class="modal-mapa-wrap"><div id="modal-map"></div></div></div></div></div>
<div class="toast" id="toast"></div>

<script>
// DATOS DE EJEMPLO (con operadores reales de García)
const DATOS_EJEMPLO = {
  ops: [
    {i:0, nom:"19201490", nombre:"HERNANDEZ HERNANDEZ JOSE", udn:"Settepi Garcia", cliente:"CON-CONMET", cliente_short:"CONMET", ruta:"F2-SAN FRANCISCO", olat:25.839445, olon:-100.399406, plat:25.818034, plon:-100.413957},
    {i:1, nom:"19201767", nombre:"RUIZ DELGADO CEBERO", udn:"Settepi Garcia", cliente:"VTE-VERTEX MTY", cliente_short:"VERTEX", ruta:"GARCIA", olat:25.793845, olon:-100.601418, plat:25.811904, plon:-100.6243},
    {i:2, nom:"19206300", nombre:"GARCIA DOÑEZ ARMANDO", udn:"Settepi Garcia", cliente:"CON-CONMET", cliente_short:"CONMET", ruta:"F2-ACUEDUCTO", olat:25.730473, olon:-100.321673, plat:25.764102, plon:-100.322587},
    {i:3, nom:"19206717", nombre:"RAMIREZ GUADALUPE", udn:"Settepi Garcia", cliente:"ALC-ALCALI", cliente_short:"ALCALI", ruta:"ESCOBEDO FIJO", olat:25.799471, olon:-100.36912, plat:25.780129, plon:-100.292243},
    {i:4, nom:"19207749", nombre:"LOMAS CARDENAS JORGE", udn:"Settepi Garcia", cliente:"EMC-EMPAQUES", cliente_short:"EMPAQUES", ruta:"CAPELLANIA", olat:25.809726, olon:-100.637035, plat:25.806342, plon:-100.612375},
    {i:5, nom:"19208139", nombre:"VELAZQUEZ CRUZ ALAN", udn:"Settepi Garcia", cliente:"NAV-NAVISTAR", cliente_short:"NAVISTAR", ruta:"N1-VILLAS DEL ARCO", olat:25.863675, olon:-100.310638, plat:25.876713, plon:-100.319303}
  ],
  udns: ["Settepi Garcia"]
};

let DATOS_ACTUALES = null;
let swapsActuales = [];
let mapaPrincipal, capaSwaps;

function escapeHTML(s) { return String(s||'').replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

function haversine(lat1,lon1,lat2,lon2) {
  const R=6371, toRad=x=>x*Math.PI/180;
  const dlat=toRad(lat2-lat1), dlon=toRad(lon2-lon1);
  const a=Math.sin(dlat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dlon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Obtener ruta real de OSRM (con timeout y fallback a lineal)
async function obtenerRutaReal(lon1, lat1, lon2, lat2) {
  const url = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?overview=false`;
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timeout);
    const data = await res.json();
    if (data.code === 'Ok' && data.routes && data.routes[0]) {
      const km = data.routes[0].distance / 1000;
      const minutos = data.routes[0].duration / 60;
      return { km, minutos, real: true };
    }
  } catch(e) { console.warn("OSRM falló, usando lineal:", e); }
  // Fallback a distancia lineal
  const km = haversine(lat1, lon1, lat2, lon2);
  return { km, minutos: km * 2.2, real: false };
}

async function calcularSwapsConRutas() {
  const listaDiv = document.getElementById('lista');
  const progressBar = document.getElementById('progress-bar');
  const progressFill = document.getElementById('progress-fill');
  
  const mismoCliente = document.getElementById('f-mismocliente').checked;
  const minAhorro = parseInt(document.getElementById('f-rango').value) || 0;
  
  let ops = [...DATOS_ACTUALES.ops];
  
  // Calcular distancia actual (lineal)
  for (let op of ops) {
    op._kmActual = haversine(op.olat, op.olon, op.plat, op.plon);
    op._minActual = op._kmActual * 2.2;
  }
  
  const kmTotalActual = ops.reduce((s,o)=>s+o._kmActual,0);
  const minTotalActual = ops.reduce((s,o)=>s+o._minActual,0);
  
  // Generar pares candidatos (mismo cliente si está activo)
  const grupos = new Map();
  for (let op of ops) {
    let key = mismoCliente ? op.cliente : 'todos';
    if (!grupos.has(key)) grupos.set(key, []);
    grupos.get(key).push(op);
  }
  
  const candidatos = [];
  let totalPares = 0;
  
  for (let [_, grupo] of grupos) {
    for (let i = 0; i < grupo.length; i++) {
      for (let j = i+1; j < grupo.length; j++) {
        totalPares++;
      }
    }
  }
  
  progressBar.style.display = 'block';
  let procesados = 0;
  
  for (let [_, grupo] of grupos) {
    for (let i = 0; i < grupo.length; i++) {
      for (let j = i+1; j < grupo.length; j++) {
        const A = grupo[i], B = grupo[j];
        procesados++;
        progressFill.style.width = (procesados / totalPares * 100) + '%';
        
        listaDiv.innerHTML = `<div class="loading"><div class="spinner"></div>Calculando rutas... ${Math.round(procesados/totalPares*100)}%<br><small>${procesados}/${totalPares} pares</small></div>`;
        
        // Obtener rutas reales para el swap
        const rutaA_B = await obtenerRutaReal(A.olon, A.olat, B.plon, B.plat);
        const rutaB_A = await obtenerRutaReal(B.olon, B.olat, A.plon, A.plat);
        
        const kmNuevoTotal = rutaA_B.km + rutaB_A.km;
        const kmActualTotal = A._kmActual + B._kmActual;
        const ahorroKm = kmActualTotal - kmNuevoTotal;
        
        if (ahorroKm >= minAhorro) {
          candidatos.push({
            A, B,
            kmA_nuevo: rutaA_B.km,
            kmB_nuevo: rutaB_A.km,
            minA_nuevo: rutaA_B.minutos,
            minB_nuevo: rutaB_A.minutos,
            ahorroKm: ahorroKm,
            ahorroMin: (A._minActual + B._minActual) - (rutaA_B.minutos + rutaB_A.minutos),
            rutasReales: { realA: rutaA_B.real, realB: rutaB_A.real }
          });
        }
        
        // Pequeña pausa para no saturar OSRM
        await new Promise(r => setTimeout(r, 200));
      }
    }
  }
  
  progressBar.style.display = 'none';
  
  // Ordenar y seleccionar mejores (sin repetir operadores)
  candidatos.sort((a,b) => b.ahorroKm - a.ahorroKm);
  const usados = new Set();
  const swaps = [];
  for (let c of candidatos) {
    if (!usados.has(c.A.i) && !usados.has(c.B.i)) {
      usados.add(c.A.i);
      usados.add(c.B.i);
      swaps.push(c);
    }
  }
  
  swapsActuales = swaps;
  const kmAhorrado = swaps.reduce((s,c)=>s+c.ahorroKm,0);
  const minAhorrado = swaps.reduce((s,c)=>s+c.ahorroMin,0);
  
  document.getElementById('kpi-actual').innerHTML = kmTotalActual.toFixed(1) + ' km';
  document.getElementById('kpi-opt').innerHTML = (kmTotalActual - kmAhorrado).toFixed(1) + ' km';
  document.getElementById('kpi-tiempo').innerHTML = Math.round(minAhorrado) + ' min';
  document.getElementById('kpi-swaps').innerHTML = swaps.length;
  
  renderListaSwaps();
  pintarMapaPrincipal();
}

function renderListaSwaps() {
  const container = document.getElementById('lista');
  document.getElementById('lista-count').innerHTML = swapsActuales.length;
  
  if (swapsActuales.length === 0) {
    container.innerHTML = '<div class="empty" style="padding:40px;text-align:center">❌ No se encontraron intercambios con el filtro actual</div>';
    return;
  }
  
  let html = '';
  for (let i = 0; i < swapsActuales.length; i++) {
    const s = swapsActuales[i];
    html += `
      <div class="swap-item" data-idx="${i}">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span><strong>#${i+1}</strong> ${escapeHTML(s.A.nombre?.split(' ')[0] || s.A.nom)} ↔ ${escapeHTML(s.B.nombre?.split(' ')[0] || s.B.nom)}</span>
          <span class="swap-ahorro">-${s.ahorroKm.toFixed(1)} km</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-top:5px">
          <span>${escapeHTML(s.A.cliente_short)} ↔ ${escapeHTML(s.B.cliente_short)}</span>
          <span class="swap-tiempo">⏱ -${Math.round(s.ahorroMin)} min</span>
        </div>
        ${!s.rutasReales.realA || !s.rutasReales.realB ? '<div style="font-size:9px;color:#f59e0b;margin-top:4px">⚠ Ruta estimada (lineal)</div>' : ''}
      </div>
    `;
  }
  container.innerHTML = html;
  
  document.querySelectorAll('.swap-item').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      abrirModal(idx);
      document.querySelectorAll('.swap-item').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
    });
  });
}

function pintarMapaPrincipal() {
  if (!mapaPrincipal) return;
  if (capaSwaps) mapaPrincipal.removeLayer(capaSwaps);
  capaSwaps = L.layerGroup().addTo(mapaPrincipal);
  
  for (let op of DATOS_ACTUALES.ops) {
    const color = '#ea580c';
    L.circleMarker([op.olat, op.olon], {radius:6, color:'white', weight:2, fillColor:color, fillOpacity:0.9})
      .bindTooltip(`🏠 ${escapeHTML(op.nombre || op.nom)}`, {sticky:true}).addTo(capaSwaps);
    L.circleMarker([op.plat, op.plon], {radius:5, color:color, weight:2, fillColor:'white', fillOpacity:1})
      .bindTooltip(`🏭 ${escapeHTML(op.ruta)}`, {sticky:true}).addTo(capaSwaps);
    L.polyline([[op.olat,op.olon],[op.plat,op.plon]], {color:'#9ca3af', weight:1.5, opacity:0.4}).addTo(capaSwaps);
  }
}

function abrirModal(idx) {
  const s = swapsActuales[idx];
  if (!s) return;
  const {A,B, kmA_nuevo, kmB_nuevo, minA_nuevo, minB_nuevo, ahorroKm, ahorroMin} = s;
  
  const htmlTabla = `
    <table class="tabla-comp">
      <tr><th>Campo</th><th>Operador A</th><th>Operador B</th></tr>
      <tr><td>Nombre</td><td><strong>${escapeHTML(A.nombre || A.nom)}</strong></td><td><strong>${escapeHTML(B.nombre || B.nom)}</strong></td></tr>
      <tr><td>UDN</td><td>${escapeHTML(A.udn)}</td><td>${escapeHTML(B.udn)}</td></tr>
      <tr><td>Cliente</td><td>${escapeHTML(A.cliente_short)}</td><td>${escapeHTML(B.cliente_short)}</td></tr>
      <tr><td>Ruta actual</td><td>${escapeHTML(A.ruta)}</td><td>${escapeHTML(B.ruta)}</td></tr>
      <tr><td>Km actual</td><td>${A._kmActual.toFixed(1)} km</td><td>${B._kmActual.toFixed(1)} km</td></tr>
      <tr><td>Km propuesto</td><td style="color:#65a30d;font-weight:bold">${kmA_nuevo.toFixed(1)} km</td><td style="color:#65a30d;font-weight:bold">${kmB_nuevo.toFixed(1)} km</td></tr>
      <tr><td>Tiempo actual</td><td>${Math.round(A._minActual)} min</td><td>${Math.round(B._minActual)} min</td></tr>
      <tr><td>Tiempo propuesto</td><td style="color:#65a30d">${Math.round(minA_nuevo)} min</td><td style="color:#65a30d">${Math.round(minB_nuevo)} min</td></tr>
    </table>
    <div class="modal-resumen">
      <strong>📊 Resumen del intercambio</strong><br>
      Ahorro total: <strong style="color:#65a30d">-${ahorroKm.toFixed(1)} km · -${Math.round(ahorroMin)} minutos</strong><br>
      Reducción: ${((ahorroKm/(A._kmActual+B._kmActual))*100).toFixed(0)}% menos distancia
    </div>
  `;
  
  document.getElementById('modal-title').innerHTML = `🔄 Intercambio #${idx+1}`;
  document.getElementById('modal-tabla').innerHTML = htmlTabla;
  document.getElementById('modal-bd').classList.add('show');
  
  setTimeout(() => {
    if (window.modalMap) window.modalMap.remove();
    const modalMap = L.map('modal-map').setView([25.78, -100.45], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {subdomains:'abcd'}).addTo(modalMap);
    
    const colorA = '#ea580c', colorB = '#1e3a8a';
    L.polyline([[A.olat,A.olon],[A.plat,A.plon]], {color:'#dc2626', weight:3, dashArray:'6,6'}).addTo(modalMap);
    L.polyline([[B.olat,B.olon],[B.plat,B.plon]], {color:'#dc2626', weight:3, dashArray:'6,6'}).addTo(modalMap);
    L.polyline([[A.olat,A.olon],[B.plat,B.plon]], {color:'#65a30d', weight:4, opacity:0.9}).addTo(modalMap);
    L.polyline([[B.olat,B.olon],[A.plat,A.plon]], {color:'#65a30d', weight:4, opacity:0.9}).addTo(modalMap);
    
    L.marker([A.olat,A.olon], {icon:L.divIcon({html:`<div style="background:${colorA};width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;border:2px solid white">A</div>`,iconSize:[30,30]})}).addTo(modalMap);
    L.marker([B.olat,B.olon], {icon:L.divIcon({html:`<div style="background:${colorB};width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;border:2px solid white">B</div>`,iconSize:[30,30]})}).addTo(modalMap);
    L.marker([A.plat,A.plon], {icon:L.divIcon({html:`<div style="background:#374151;width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:white;font-size:12px">A</div>`,iconSize:[26,26]})}).addTo(modalMap);
    L.marker([B.plat,B.plon], {icon:L.divIcon({html:`<div style="background:#374151;width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:white;font-size:12px">B</div>`,iconSize:[26,26]})}).addTo(modalMap);
    
    const bounds = L.latLngBounds([[A.olat,A.olon],[A.plat,A.plon],[B.olat,B.olon],[B.plat,B.plon]]);
    modalMap.fitBounds(bounds, {padding:[50,50]});
    window.modalMap = modalMap;
  }, 100);
}

function iniciarMapa() {
  mapaPrincipal = L.map('map').setView([25.78, -100.45], 11);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {subdomains:'abcd', attribution:'© OpenStreetMap'}).addTo(mapaPrincipal);
}

function cargarDatosEjemplo() {
  DATOS_ACTUALES = DATOS_EJEMPLO;
  document.getElementById('archivo-info').innerHTML = '📊 Datos de ejemplo: 6 operadores en García';
  calcularSwapsConRutas();
}

async function cargarArchivoExcel(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type:'array'});
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet);
      
      const ops = [];
      for (let i=0; i<rows.length; i++) {
        const r = rows[i];
        const latOp = parseFloat(r['Lat op'] || r['Latitud OP']);
        const lonOp = parseFloat(r['Long Op'] || r['Longitud OP']);
        const latPi = parseFloat(r['Lat Pi'] || r['Latitud PI']);
        const lonPi = parseFloat(r['Long Pi'] || r['longitud PI']);
        if (isNaN(latOp) || isNaN(lonOp) || isNaN(latPi) || isNaN(lonPi)) continue;
        
        let nombre = r['Operadores'] || r['Nombre'] || '';
        let nom = '';
        if (nombre.includes('-')) {
          const parts = nombre.split('-');
          nom = parts[0].trim();
          nombre = parts.slice(1).join('-').trim();
        }
        
        ops.push({
          i: ops.length,
          nom: nom,
          nombre: nombre || 'Sin nombre',
          udn: r['UDN'] || 'Settepi Garcia',
          cliente: r['Ruta asignada'] || r['Cliente'] || '',
          cliente_short: (r['Ruta asignada'] || '').split('-')[1] || 'Cliente',
          ruta: r['Ruta asignada'] || r['RUTA 1'] || '',
          olat: latOp, olon: lonOp, plat: latPi, plon: lonPi
        });
      }
      
      if (ops.length === 0) throw new Error('No se encontraron datos válidos');
      DATOS_ACTUALES = { ops: ops, udns: [...new Set(ops.map(o=>o.udn))] };
      document.getElementById('archivo-info').innerHTML = `📁 ${file.name} · ${ops.length} operadores`;
      calcularSwapsConRutas();
      mostrarToast(`✅ Cargados ${ops.length} operadores`, 3000);
    } catch(err) {
      mostrarToast('❌ Error al leer el archivo: ' + err.message, 5000);
    }
  };
  reader.readAsArrayBuffer(file);
}

function mostrarToast(msg, duracion) {
  const toast = document.getElementById('toast');
  toast.innerHTML = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), duracion);
}

// Inicializar
window.addEventListener('DOMContentLoaded', () => {
  iniciarMapa();
  cargarDatosEjemplo();
  
  document.getElementById('btn-recalc').addEventListener('click', () => calcularSwapsConRutas());
  document.getElementById('btn-upload').addEventListener('click', () => document.getElementById('file-input').click());
  document.getElementById('file-input').addEventListener('change', (e) => {
    if (e.target.files[0]) cargarArchivoExcel(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('modal-close').addEventListener('click', () => document.getElementById('modal-bd').classList.remove('show'));
  document.getElementById('modal-bd').addEventListener('click', (e) => { if (e.target.id === 'modal-bd') document.getElementById('modal-bd').classList.remove('show'); });
});
</script>
