  .stop-item .stop-num {

<body>
<header>
  <div class="logo">TRAXIÓN</div>
  <div class="divider"></div>
  <div class="title">Calidad MAE — Rutas y Paradas</div>
  <div class="spacer"></div>
  <div class="semana-select-wrap">
    <label for="semanaFilter">Semana</label>
    <select id="semanaFilter"><option value="__ALL__">Todas</option></select>
  </div>
  <div class="status-badge" id="statusBadge">Cargando…</div>
  <button class="refresh-btn" id="refreshBtn" title="Recargar datos del Sheet">↻ Actualizar</button>
</header>

<main>
  <nav class="breadcrumb" id="breadcrumb"></nav>
  <div class="kpi-row" id="kpiRow"></div>

  <div class="search-row">
    <input id="searchInput" type="search" placeholder="Buscar...">
    <div class="legend">
      <span><span class="swatch" style="background:#22c55e"></span>≥98%</span>
      <span><span class="swatch" style="background:#f59e0b"></span>90–97.99%</span>
      <span><span class="swatch" style="background:#ef4444"></span>&lt;90%</span>
      <span><span class="swatch" style="background:#94a3b8"></span>N/A</span>
    </div>
  </div>

  <div id="viewContainer"></div>
</main>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Cargando datos desde Google Sheets…</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* ===================== CONFIG ===================== */
const SHEET_ID = "1SoFnV2HwXaGOfh6MR9Z3Sryqa4BvifH-KL-PnxgPsLs";
const SHEET_GID = "0";
// We load via gviz JSON with a JSONP callback (script-tag). This sidesteps
// CORS entirely — needed because the Cowork artifact iframe runs with a
// sandbox that blocks cross-origin fetch to Google's CSV endpoint.

/* ===================== STATE ===================== */
let RECORDS_ALL = []; // full parsed dataset (all E rows, all weeks)
let RECORDS = [];     // filtered by selected week
const STATE = {
  view: 'plants',
  planta: null,
  ruta: null,
  search: '',
  semana: '__ALL__',
  plantsSort: {key: 'cal_pd', dir: 'asc'},
};
let mapInstance = null;
let mapMarkers = [];
let mapRouteLayer = null;
let mapFetchToken = 0;

/* ===================== HELPERS ===================== */
function colorClassForScore(v) {
  if (v == null || isNaN(v)) return 'gray';
  if (v >= 98) return 'green';
  if (v >= 90) return 'amber';
  return 'red';
}
function badgeClassForScore(v) { return 'badge-' + colorClassForScore(v); }
function fmtScore(v) {
  if (v == null || isNaN(v)) return 'N/A';
  return v.toFixed(1) + '%';
}
function avg(arr) {
  const clean = arr.filter(x => x != null && !isNaN(x));
  if (clean.length === 0) return null;
  return clean.reduce((a,b)=>a+b,0) / clean.length;
}
function parseNumOrNull(v) {
  if (v == null) return null;
  const s = String(v).trim();
  if (s === '' || s.toUpperCase() === 'N/A') return null;
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function hexForScore(v) {
  if (v == null || isNaN(v)) return '#94a3b8';
  if (v >= 98) return '#22c55e';
  if (v >= 90) return '#f59e0b';
  return '#ef4444';
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escapeAttr(s) { return escapeHtml(s); }

/* ===================== CSV parser ===================== */
function parseCSV(text) {
  let i = 0, field = '', row = [], inQ = false;
  const rowsRaw = [];
  while (i < text.length) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i+1] === '"') { field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += ch; i++;
    } else {
      if (ch === '"') { inQ = true; i++; continue; }
      if (ch === ',') { row.push(field); field=''; i++; continue; }
      if (ch === '\r') { i++; continue; }
      if (ch === '\n') { row.push(field); rowsRaw.push(row); row=[]; field=''; i++; continue; }
      field += ch; i++;
    }
  }
  if (field.length || row.length) { row.push(field); rowsRaw.push(row); }
  if (rowsRaw.length === 0) return [];
  const headers = rowsRaw[0].map(h => h.trim());
  const out = [];
  for (let r = 1; r < rowsRaw.length; r++) {
    const rr = rowsRaw[r];
    if (rr.length === 1 && rr[0] === '') continue;
    const obj = {};
    for (let c = 0; c < headers.length; c++) obj[headers[c]] = rr[c] == null ? '' : rr[c];
    out.push(obj);
  }
  return out;
}

/**
 * The gviz CSV endpoint always returns UTF-8, but a header called "Semana"
 * may live under one of several capitalizations/accentuations. Find the key
 * in `row` whose normalized name matches any of `candidates`.
 */
function pickField(row, candidates) {
  const keys = Object.keys(row);
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
  for (const cand of candidates) {
    const nc = norm(cand);
    for (const k of keys) if (norm(k) === nc) return k;
  }
  return null;
}

/* ===================== DATA LOAD (JSONP via script tag) ===================== */
/**
 * Convert a gviz JSON response into an array of plain-object rows keyed by
 * column label — matches what the CSV parser used to produce, so downstream
 * code (pickField, filtering, aggregations) needs no changes.
 */
function gvizToRows(response) {
  if (!response || !response.table) throw new Error('Respuesta gviz vacía');
  const cols = response.table.cols.map(c => (c.label || c.id || '').trim());
  return response.table.rows.map(r => {
    const obj = {};
    for (let i = 0; i < cols.length; i++) {
      const cell = r.c ? r.c[i] : null;
      // Prefer .v (raw value) for numbers; use .f only when it's a plain-text
      // header we want to preserve verbatim.
      if (cell == null) { obj[cols[i]] = ''; continue; }
      if (cell.v == null) { obj[cols[i]] = cell.f || ''; continue; }
      obj[cols[i]] = String(cell.v);
    }
    return obj;
  });
}

function processRows(rows) {
  if (rows.length === 0) throw new Error('El Sheet no devolvió filas');

  const sample = rows[0];
  const kPlanta   = pickField(sample, ['Planta']);
  const kTipSer   = pickField(sample, ['Tip. Ser.', 'Tip Ser', 'TipSer', 'Tipo Servicio', 'TipoServicio', 'Tip']);
  const kDescRuta = pickField(sample, ['Desc Ruta','DescRuta','Descripcion Ruta','Descripción Ruta']);
  const kIdRuta   = pickField(sample, ['ID Ruta','IDRuta','Id Ruta','IdRuta']);
  const kSec      = pickField(sample, ['Sec','Secuencia']);
  const kPos      = pickField(sample, ['Pos.','Pos','Posicion','Posición']);
  const kParada   = pickField(sample, ['Parada']);
  const kLat      = pickField(sample, ['Lat','Latitud','Latitude']);
  const kLng      = pickField(sample, ['Lng','Long','Longitud','Longitude']);
  const kH1       = pickField(sample, ['H1','Hora']);
  const kCalRt    = pickField(sample, ['Cal Rt','CalRt','Calif Ruta','Cal Ruta']);
  const kCalPd    = pickField(sample, ['Cal Pd','CalPd','Calif Parada','Cal Parada']);
  const kSemana   = pickField(sample, ['Semana','Sem','Week']);

  if (!kPlanta || !kTipSer) throw new Error('El Sheet no contiene las columnas requeridas (Planta / Tip. Ser.)');

  const filtered = rows.filter(r => (r[kTipSer]||'').trim().toUpperCase() === 'E');
  RECORDS_ALL = filtered.map(r => ({
    planta: (r[kPlanta] || '').trim(),
    desc_ruta: (r[kDescRuta] || '').trim(),
    id_ruta: (r[kIdRuta] || '').trim(),
    sec: (r[kSec] || '').trim(),
    pos: (r[kPos] || '').trim(),
    parada: (r[kParada] || '').trim(),
    lat: parseNumOrNull(r[kLat]),
    lng: parseNumOrNull(r[kLng]),
    h1: (r[kH1] || '').trim(),
    cal_rt: parseNumOrNull(r[kCalRt]),
    cal_pd: parseNumOrNull(r[kCalPd]),
    semana: kSemana ? (r[kSemana] || '').trim() : '',
  }));

  // Populate Semana dropdown
  const semanas = [...new Set(RECORDS_ALL.map(r => r.semana).filter(s => s !== ''))];
  semanas.sort((a,b) => {
    const na = parseFloat(a), nb = parseFloat(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return a.localeCompare(b);
  });
  const sel = document.getElementById('semanaFilter');
  const prev = STATE.semana;
  sel.innerHTML = '<option value="__ALL__">Todas</option>' +
    semanas.map(s => `<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`).join('');
  if (prev !== '__ALL__' && semanas.includes(prev)) {
    sel.value = prev;
  } else {
    sel.value = '__ALL__';
    STATE.semana = '__ALL__';
  }

  document.getElementById('statusBadge').textContent =
    RECORDS_ALL.length.toLocaleString('es-MX') + ' paradas E · ' +
    (semanas.length ? semanas.length + ' semanas' : 'sin col. Semana');

  applySemanaFilter();
  render();
}

function loadSheet() {
  const overlay = document.getElementById('loadingOverlay');
  const txt = document.getElementById('loadingText');
  overlay.classList.remove('hidden');
  txt.textContent = 'Cargando datos desde Google Sheets…';
  document.querySelector('.loading-error')?.remove();

  const cb = 'gvizCB_' + Math.random().toString(36).slice(2).replace(/[^a-z0-9]/g,'');
  const url = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
              '/gviz/tq?tqx=out:json;responseHandler:' + cb + '&gid=' + SHEET_GID +
              '&_=' + Date.now();

  let timeoutId = null;
  const cleanup = () => {
    try { delete window[cb]; } catch(e) { window[cb] = undefined; }
    const s = document.getElementById('gvizScriptTag');
    if (s) s.remove();
    if (timeoutId) clearTimeout(timeoutId);
  };

  const showError = (msg) => {
    txt.textContent = 'No se pudo cargar el Sheet.';
    document.querySelector('.loading-error')?.remove();
    const errBox = document.createElement('div');
    errBox.className = 'loading-error';
    errBox.innerHTML =
      'Error: ' + escapeHtml(msg) +
      '<br><br>Verifica que el Sheet siga siendo público (Cualquier persona con el enlace).' +
      '<br><a href="https://docs.google.com/spreadsheets/d/' + SHEET_ID + '" target="_blank">Abrir el Sheet</a>' +
      '<br><br><button onclick="loadSheet()" style="margin-top:8px;padding:6px 14px;background:#22c55e;color:#0d1421;border:none;border-radius:6px;font-weight:700;cursor:pointer;">Reintentar</button>';
    overlay.appendChild(errBox);
    document.getElementById('statusBadge').textContent = 'Error al cargar';
  };

  window[cb] = function(response) {
    cleanup();
    try {
      const rows = gvizToRows(response);
      processRows(rows);
      overlay.classList.add('hidden');
    } catch(err) {
      showError(err.message || String(err));
    }
  };

  const script = document.createElement('script');
  script.id = 'gvizScriptTag';
  script.src = url;
  script.onerror = () => {
    cleanup();
    showError('El navegador no pudo cargar la respuesta del Sheet. Revisa que sea público con acceso "Cualquier persona con el enlace".');
  };
  timeoutId = setTimeout(() => {
    cleanup();
    showError('Timeout esperando la respuesta del Sheet (30 s).');
  }, 30000);
  document.body.appendChild(script);
}

function applySemanaFilter() {
  if (STATE.semana === '__ALL__' || !STATE.semana) {
    RECORDS = RECORDS_ALL.slice();
  } else {
    RECORDS = RECORDS_ALL.filter(r => r.semana === STATE.semana);
  }
}

/* ===================== AGGREGATIONS ===================== */
function plantSummary() {
  const map = new Map();
  for (const r of RECORDS) {
    if (!map.has(r.planta)) map.set(r.planta, {planta: r.planta, records: [], rutas: new Set()});
    const p = map.get(r.planta);
    p.records.push(r);
    p.rutas.add(r.id_ruta);
  }
  return [...map.values()].map(p => ({
    planta: p.planta,
    rutas: p.rutas.size,
    paradas: p.records.length,
    cal_rt: avg(p.records.map(r => r.cal_rt)),
    cal_pd: avg(p.records.map(r => r.cal_pd)),
  }));
}

function routeSummary(planta) {
  const map = new Map();
  for (const r of RECORDS) {
    if (r.planta !== planta) continue;
    if (!map.has(r.id_ruta)) map.set(r.id_ruta, {id_ruta: r.id_ruta, desc_ruta: r.desc_ruta, records: []});
    map.get(r.id_ruta).records.push(r);
  }
  return [...map.values()].map(x => ({
    id_ruta: x.id_ruta,
    desc_ruta: x.desc_ruta,
    paradas: x.records.length,
    cal_rt: avg(x.records.map(r => r.cal_rt)),
    cal_pd: avg(x.records.map(r => r.cal_pd)),
  })).sort((a,b) => a.desc_ruta.localeCompare(b.desc_ruta));
}

function stopsForRoute(planta, id_ruta) {
  return RECORDS
    .filter(r => r.planta === planta && r.id_ruta === id_ruta)
    .sort((a,b) => (parseInt(a.sec)||0) - (parseInt(b.sec)||0));
}

/* ===================== RENDER: BREADCRUMB ===================== */
function renderBreadcrumb() {
  const el = document.getElementById('breadcrumb');
  const parts = [];
  parts.push(`<span class="crumb" data-nav="plants">Plantas</span>`);
  if (STATE.view !== 'plants') {
    parts.push(`<span class="sep">›</span>`);
    parts.push(`<span class="crumb" data-nav="routes">${escapeHtml(STATE.planta)}</span>`);
  }
  if (STATE.view === 'stops') {
    const routeName = RECORDS.find(r => r.planta===STATE.planta && r.id_ruta===STATE.ruta)?.desc_ruta || STATE.ruta;
    parts.push(`<span class="sep">›</span>`);
    parts.push(`<span class="crumb current">${escapeHtml(routeName)}</span>`);
  }
  el.innerHTML = parts.join('');
  el.querySelectorAll('.crumb[data-nav]').forEach(c => {
    c.addEventListener('click', () => {
      if (c.dataset.nav === 'plants') { STATE.view='plants'; STATE.planta=null; STATE.ruta=null; }
      if (c.dataset.nav === 'routes') { STATE.view='routes'; STATE.ruta=null; }
      STATE.search = '';
      document.getElementById('searchInput').value = '';
      render();
    });
  });
}

/* ===================== RENDER: KPI ===================== */
function renderKPIs() {
  const el = document.getElementById('kpiRow');
  let cards = [];
  if (STATE.view === 'plants') {
    const plants = plantSummary();
    const totalRoutes = plants.reduce((s,p)=>s+p.rutas,0);
    const totalStops  = plants.reduce((s,p)=>s+p.paradas,0);
    const avgRt = avg(RECORDS.map(r=>r.cal_rt));
    const avgPd = avg(RECORDS.map(r=>r.cal_pd));
    cards = [
      {label:'Plantas', value: plants.length, cls:'k-neutral'},
      {label:'Rutas totales', value: totalRoutes, cls:'k-neutral'},
      {label:'Paradas totales', value: totalStops.toLocaleString('es-MX'), cls:'k-neutral'},
      {label:'Calidad Ruta promedio', value: fmtScore(avgRt), cls: 'k-'+colorClassForScore(avgRt)},
      {label:'Calidad Parada promedio', value: fmtScore(avgPd), cls: 'k-'+colorClassForScore(avgPd)},
    ];
  } else if (STATE.view === 'routes') {
    const routes = routeSummary(STATE.planta);
    const totalStops = routes.reduce((s,r)=>s+r.paradas,0);
    const recs = RECORDS.filter(r => r.planta === STATE.planta);
    const avgRt = avg(recs.map(r=>r.cal_rt));
    const avgPd = avg(recs.map(r=>r.cal_pd));
    cards = [
      {label:'Rutas', value: routes.length, cls:'k-neutral'},
      {label:'Paradas', value: totalStops.toLocaleString('es-MX'), cls:'k-neutral'},
      {label:'Calidad Ruta promedio', value: fmtScore(avgRt), cls: 'k-'+colorClassForScore(avgRt)},
      {label:'Calidad Parada promedio', value: fmtScore(avgPd), cls: 'k-'+colorClassForScore(avgPd)},
    ];
  } else if (STATE.view === 'stops') {
    const stops = stopsForRoute(STATE.planta, STATE.ruta);
    const avgRt = avg(stops.map(r=>r.cal_rt));
    const avgPd = avg(stops.map(r=>r.cal_pd));
    const cumpl = stops.filter(s => s.cal_pd != null && s.cal_pd >= 98).length;
    const pctCumpl = stops.length ? (cumpl / stops.length) * 100 : null;
    cards = [
      {label:'Paradas', value: stops.length, cls:'k-neutral'},
      {label:'Calidad Ruta', value: fmtScore(avgRt), cls: 'k-'+colorClassForScore(avgRt)},
      {label:'Calidad Parada promedio', value: fmtScore(avgPd), cls: 'k-'+colorClassForScore(avgPd)},
      {label:'Paradas ≥98%', value: pctCumpl==null ? '—' : cumpl + ' / ' + stops.length, cls:'k-'+colorClassForScore(pctCumpl)},
    ];
  }
  el.innerHTML = cards.map(c =>
    `<div class="kpi ${c.cls}"><div class="k-value">${c.value}</div><div class="k-label">${c.label}</div></div>`
  ).join('');
}

/* ===================== RENDER: PLANTS (table) ===================== */
function renderPlants() {
  const container = document.getElementById('viewContainer');
  let plants = plantSummary().filter(p =>
    !STATE.search || p.planta.toLowerCase().includes(STATE.search.toLowerCase())
  );

  // Sort
  const {key, dir} = STATE.plantsSort;
  const s = dir === 'asc' ? 1 : -1;
  plants.sort((a, b) => {
    let av = a[key], bv = b[key];
    if (typeof av === 'string' || typeof bv === 'string') {
      return s * String(av||'').localeCompare(String(bv||''));
    }
    // Nulls at bottom in ascending, top in descending
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    return s * (av - bv);
  });

  if (plants.length === 0) {
    container.innerHTML = '<div class="empty"><h3>Sin resultados</h3><p>Ajusta la búsqueda o la semana seleccionada.</p></div>';
    return;
  }

  const rows = plants.map((p, idx) => {
    const rank = idx + 1;
    let rankCls = 'rk-neutral';
    if (p.cal_pd != null) {
      if (rank <= 3 && p.cal_pd < 90) rankCls = 'rk-red';
      else if (rank <= 6 && p.cal_pd < 98) rankCls = 'rk-amber';
    }
    return `
      <tr data-planta="${escapeAttr(p.planta)}">
        <td class="num"><span class="rank-badge ${rankCls}">${rank}</span></td>
        <td><span class="plant-name">${escapeHtml(p.planta)}<span class="arrow">▸</span></span></td>
        <td class="num">${p.rutas}</td>
        <td class="num">${p.paradas.toLocaleString('es-MX')}</td>
        <td class="right txt-${colorClassForScore(p.cal_rt)}">${fmtScore(p.cal_rt)}</td>
        <td class="right txt-${colorClassForScore(p.cal_pd)}">${fmtScore(p.cal_pd)}</td>
      </tr>
    `;
  }).join('');

  const th = (key, label, opts={}) => {
    const active = STATE.plantsSort.key === key;
    const indicator = active ? (STATE.plantsSort.dir === 'asc' ? '▲' : '▼') : '↕';
    const classes = ['sortable'];
    if (opts.num) classes.push('num');
    if (opts.right) classes.push('right');
    if (active) classes.push('active');
    return `<th class="${classes.join(' ')}" data-key="${key}">${label}<span class="sort-ind">${indicator}</span></th>`;
  };

  container.innerHTML = `
    <div class="section-title">Resumen por Planta <span class="count-badge">${plants.length}</span></div>
    <div class="plants-table-wrap">
      <table class="plants-table">
        <thead>
          <tr>
            <th class="num">#</th>
            ${th('planta', 'PLANTA / GRUPO')}
            ${th('rutas', 'RUTAS', {num:true})}
            ${th('paradas', 'PARADAS', {num:true})}
            ${th('cal_rt', 'CAL RUTA', {right:true})}
            ${th('cal_pd', 'CAL PARADA', {right:true})}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="table-footer">
        <span>Ordenado por ${labelForSortKey(STATE.plantsSort.key)} (${STATE.plantsSort.dir === 'asc' ? 'ascendente' : 'descendente'})</span>
        <span>${plants.length} plantas</span>
      </div>
    </div>
  `;

  container.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', () => {
      STATE.planta = tr.dataset.planta;
      STATE.view = 'routes';
      STATE.search = '';
      document.getElementById('searchInput').value = '';
      render();
    });
  });
  container.querySelectorAll('thead th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.key;
      if (STATE.plantsSort.key === k) {
        STATE.plantsSort.dir = STATE.plantsSort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        STATE.plantsSort.key = k;
        STATE.plantsSort.dir = (k === 'planta' ? 'asc' : 'asc');
      }
      renderPlants();
    });
  });
}
function labelForSortKey(k) {
  return {planta:'planta', rutas:'rutas', paradas:'paradas', cal_rt:'Cal Ruta', cal_pd:'Cal Parada'}[k] || k;
}

function initMap(stops, list) {
  if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  mapMarkers = []; mapRouteLayer = null; mapFetchToken++;

  const validStops = stops.filter(s => s.lat != null && s.lng != null && !isNaN(s.lat) && !isNaN(s.lng));
  if (validStops.length === 0) {
    document.getElementById('map').innerHTML =
      '<div class="empty" style="height:100%;display:flex;flex-direction:column;justify-content:center;"><h3>Sin coordenadas</h3><p>Las paradas no tienen ubicación registrada.</p></div>';
    return;
  }
  const center = [
    validStops.reduce((s,x)=>s+x.lat,0)/validStops.length,
    validStops.reduce((s,x)=>s+x.lng,0)/validStops.length
  ];
  mapInstance = L.map('map', {zoomControl: true}).setView(center, 12);

  // Google Maps tiles (roadmap style). Uses mt0-mt3 subdomains.
  L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
    maxZoom: 20,
    subdomains: ['mt0','mt1','mt2','mt3'],
    attribution: '&copy; Google Maps'
  }).addTo(mapInstance);

  const bounds = [];
  const latlngs = [];
  validStops.forEach((s, idx) => {
    const color = hexForScore(s.cal_pd);
    const icon = L.divIcon({
      className: 'leaflet-div-icon-custom',
      html: `<div class="marker-pin" style="background:${color}"><span>${s.sec || (idx+1)}</span></div>`,
      iconSize: [28,28],
      iconAnchor: [14, 28],
    });
    const marker = L.marker([s.lat, s.lng], {icon}).addTo(mapInstance);
    marker.bindPopup(`
      <div style="font-family: inherit;">
        <div style="font-weight:700;font-size:13px;margin-bottom:4px;">${escapeHtml(s.parada || '—')}</div>
        <div style="font-size:11px;color:#64748b;">Sec ${s.sec} · ${escapeHtml(s.pos||'')}</div>
        ${s.h1 ? '<div style="font-size:11px;color:#64748b;">Hora: ' + escapeHtml(s.h1) + '</div>' : ''}
        <div style="margin-top:6px;display:flex;gap:6px;">
          <span style="background:${hexForScore(s.cal_rt)};color:white;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700;">Ruta ${fmtScore(s.cal_rt)}</span>
          <span style="background:${hexForScore(s.cal_pd)};color:white;padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700;">Parada ${fmtScore(s.cal_pd)}</span>
        </div>
      </div>
    `);
    mapMarkers.push({marker, record: s});
    bounds.push([s.lat, s.lng]);
    latlngs.push([s.lat, s.lng]);
  });

  if (latlngs.length > 1) {
    mapRouteLayer = L.polyline(latlngs, {color: '#0d1421', weight: 2, opacity: 0.35, dashArray: '5,7'}).addTo(mapInstance);
  }
  if (bounds.length > 1) mapInstance.fitBounds(bounds, {padding: [40,40]});

  fetchAndDrawRoadRoute(latlngs);

  list.querySelectorAll('.stop-item').forEach(el => {
    el.addEventListener('click', () => {
      const idx = parseInt(el.dataset.idx);
      const s = stops[idx];
      if (s.lat != null && s.lng != null) {
        mapInstance.setView([s.lat, s.lng], 15);
        const found = mapMarkers.find(m => m.record === s);
        if (found) found.marker.openPopup();
      }
      list.querySelectorAll('.stop-item').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
    });
  });
}

/**
 * Fetch driving route between waypoints from OSRM public demo and redraw as
 * dashed polyline that follows real streets. Silent fallback on error.
 */
async function fetchAndDrawRoadRoute(latlngs) {
  if (!latlngs || latlngs.length < 2) return;
  const token = ++mapFetchToken;
  const mapAtStart = mapInstance;

  const CHUNK = 100;
  const segments = [];
  for (let i = 0; i < latlngs.length - 1; i += (CHUNK - 1)) {
    segments.push(latlngs.slice(i, i + CHUNK));
  }
  const stitched = [];
  try {
    for (const seg of segments) {
      const coordsStr = seg.map(p => p[1].toFixed(6) + ',' + p[0].toFixed(6)).join(';');
      const url = 'https://router.project-osrm.org/route/v1/driving/' + coordsStr +
                  '?overview=full&geometries=geojson';
      const resp = await fetch(url);
      if (!resp.ok) throw new Error('OSRM ' + resp.status);
      const json = await resp.json();
      if (token !== mapFetchToken || mapInstance !== mapAtStart) return;
      if (!json.routes || !json.routes[0]) throw new Error('no route');
      const coords = json.routes[0].geometry.coordinates;
      for (const [lng, lat] of coords) {
        if (stitched.length && stitched[stitched.length-1][0]===lat && stitched[stitched.length-1][1]===lng) continue;
        stitched.push([lat, lng]);
      }
    }
    if (token !== mapFetchToken || mapInstance !== mapAtStart) return;
    if (mapRouteLayer) { mapInstance.removeLayer(mapRouteLayer); mapRouteLayer = null; }
    mapRouteLayer = L.polyline(stitched, {
      color: '#0d1421', weight: 3, opacity: 0.7, dashArray: '6,8', lineJoin: 'round'
    }).addTo(mapInstance);
  } catch (err) {
    console.warn('Road route unavailable, keeping straight-line fallback:', err);
  }
}

/* ===================== ORCHESTRATOR ===================== */
function render() {
  renderBreadcrumb();
  renderKPIs();
  if (STATE.view === 'plants') renderPlants();
  else if (STATE.view === 'routes') renderRoutes();
  else if (STATE.view === 'stops') renderStops();
  updateSearchPlaceholder();
}
function updateSearchPlaceholder() {
  const inp = document.getElementById('searchInput');
  if (STATE.view === 'plants') inp.placeholder = 'Buscar planta...';
  else if (STATE.view === 'routes') inp.placeholder = 'Buscar ruta (nombre o ID)...';
  else inp.placeholder = 'Buscar parada...';
}

/* ===================== EVENTS ===================== */
document.getElementById('searchInput').addEventListener('input', (e) => {
  STATE.search = e.target.value;
  if (STATE.view === 'plants') renderPlants();
  else if (STATE.view === 'routes') renderRoutes();
  else if (STATE.view === 'stops') renderStops();
});
document.getElementById('semanaFilter').addEventListener('change', (e) => {
  STATE.semana = e.target.value;
  STATE.view = 'plants'; STATE.planta = null; STATE.ruta = null;
  STATE.search = '';
  document.getElementById('searchInput').value = '';
  applySemanaFilter();
  render();
});
document.getElementById('refreshBtn').addEventListener('click', () => loadSheet());

/* ===================== INIT ===================== */
loadSheet();
</script>
</body>
