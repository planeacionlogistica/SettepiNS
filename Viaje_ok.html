<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Viaje OK — Nivel de Cumplimiento por Planta</title>
<style>
  :root{
    --navy:#0e2437;
    --navy-2:#122b40;
    --green:#a4d520;
    --green-dark:#8bbc10;
    --orange:#f39c12;
    --red:#e74c3c;
    --blue:#2c6ca8;
    --bg:#f4f6f8;
    --card:#ffffff;
    --text:#1f2d3d;
    --muted:#6b7c8f;
    --border:#e4e9ef;
    --ok:#27ae60;
    --warn:#e67e22;
    --bad:#e74c3c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  header.topbar{
    background:var(--navy);color:#fff;padding:16px 28px;
    display:flex;align-items:center;gap:22px;box-shadow:0 2px 6px rgba(0,0,0,0.08);
  }
  header.topbar .logo{font-weight:800;letter-spacing:1px;color:var(--green);font-size:22px;}
  header.topbar .divider{width:1px;height:22px;background:#2c4560;}
  header.topbar .subtitle{font-weight:500;font-size:16px;color:#dfe7ef;}
  header.topbar .badge{margin-left:auto;background:var(--green);color:var(--navy);padding:6px 12px;border-radius:14px;font-weight:700;font-size:12px;}
  main{padding:22px 28px 60px;max-width:1400px;margin:0 auto;}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;
    background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:14px;
  }
  .toolbar .title{font-weight:700;color:var(--navy);font-size:14px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;background:var(--green);color:var(--navy);
    border:none;border-radius:8px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;
    transition:background .15s ease, transform .05s ease;
  }
  .btn:hover{background:var(--green-dark);}
  .btn:active{transform:translateY(1px);}
  .btn.secondary{background:#e6ecf2;color:var(--navy);}
  .btn.secondary:hover{background:#d3dce6;}
  .btn.mini{padding:6px 10px;font-size:12px;}
  .file-info{font-size:12px;color:var(--muted);}

  .filter-bar{
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 18px;margin-bottom:18px;
  }
  .filter-bar .label{font-weight:700;color:var(--navy);font-size:13px;}
  .filter-bar .hint{font-size:11px;color:var(--muted);}
  .chip{
    display:inline-flex;align-items:center;gap:6px;background:#eef2f6;color:var(--navy);
    padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;
    cursor:pointer;border:2px solid transparent;transition:all .15s ease;user-select:none;
  }
  .chip:hover{background:#dfe6ed;}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .chip.on .count{background:var(--green);color:var(--navy);}
  .chip .count{background:#c4cfda;color:var(--navy);padding:1px 8px;border-radius:8px;font-size:11px;font-variant-numeric:tabular-nums;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .kpi{
    background:var(--card);border-radius:10px;overflow:hidden;
    border:1px solid var(--border);position:relative;padding:20px 22px;box-shadow:0 1px 2px rgba(0,0,0,0.03);
  }
  .kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--navy);}
  .kpi.orange::before{background:var(--orange);}
  .kpi.red::before{background:var(--red);}
  .kpi.green::before{background:var(--green);}
  .kpi .value{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1;color:var(--navy);}
  .kpi.green .value{color:var(--ok);}
  .kpi.red .value{color:var(--red);}
  .kpi.orange .value{color:var(--orange);}
  .kpi .label{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-top:6px;font-weight:600;}
  .kpi .sub{font-size:11px;color:var(--muted);margin-top:4px;}

  .section{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:18px;}
  .section h2{margin:0 0 6px;color:var(--navy);font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;}
  .section h2 .icon{color:var(--green);}
  .section p.desc{margin:0 0 14px;font-size:12px;color:var(--muted);}

  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;font-size:12px;color:var(--muted);}
  .legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .legend .g{background:var(--ok);} .legend .y{background:var(--warn);} .legend .r{background:var(--bad);}

  .plants{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;}
  .plant{
    border:1px solid var(--border);border-radius:10px;background:#fff;padding:14px 16px;cursor:pointer;
    transition:box-shadow .15s ease, border-color .15s ease;display:flex;flex-direction:column;gap:10px;
  }
  .plant:hover{box-shadow:0 4px 14px rgba(0,0,0,0.08);border-color:#c9d3de;}
  .plant .head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .plant .name{font-weight:700;color:var(--navy);font-size:14px;}
  .plant .pct{font-size:22px;font-weight:800;letter-spacing:-0.5px;}
  .plant .pct.ok{color:var(--ok);} .plant .pct.warn{color:var(--warn);} .plant .pct.bad{color:var(--bad);}
  .plant .bar{width:100%;height:8px;background:#eef1f5;border-radius:6px;overflow:hidden;position:relative;}
  .plant .bar > span{display:block;height:100%;border-radius:6px;transition:width .3s ease;}
  .plant .foot{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);}
  .plant .foot .rev{background:#fbe9e7;color:var(--bad);border-radius:10px;padding:2px 8px;font-weight:700;}
  .plant .foot .rev.zero{background:#e8f6ee;color:var(--ok);}
  .plant .foot .rev.warn{background:#fff3e0;color:var(--warn);}
  .plant .status{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .plant .status .dot{width:8px;height:8px;border-radius:50%;}
  .plant .status.ok{color:var(--ok);} .plant .status.ok .dot{background:var(--ok);}
  .plant .status.warn{color:var(--warn);} .plant .status.warn .dot{background:var(--warn);}
  .plant .status.bad{color:var(--bad);} .plant .status.bad .dot{background:var(--bad);}

  .modal-back{position:fixed;inset:0;background:rgba(14,36,55,0.6);display:none;justify-content:center;align-items:flex-start;z-index:50;padding:40px 20px;overflow:auto;}
  .modal-back.open{display:flex;}
  .modal{background:#fff;border-radius:12px;max-width:1100px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.35);overflow:hidden;}
  .modal .mhead{background:var(--navy);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;}
  .modal .mhead h3{margin:0;font-size:18px;}
  .modal .mhead .breadcrumb{font-size:12px;color:#c8d3de;margin-top:2px;}
  .modal .mhead .close{background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;}
  .modal .mbody{padding:18px 22px;}
  .modal .msum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
  .msum .box{background:#f7f9fc;border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .msum .box .lbl{font-size:10px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-weight:600;}
  .msum .box .val{font-size:20px;font-weight:800;color:var(--navy);}
  .msum .box.ok .val{color:var(--ok);}
  .msum .box.warn .val{color:var(--warn);}
  .msum .box.bad .val{color:var(--bad);}

  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--blue);cursor:pointer;font-weight:700;margin-bottom:10px;}
  .back-link:hover{text-decoration:underline;}

  table.rt{width:100%;border-collapse:collapse;font-size:13px;}
  table.rt thead th{background:#f2f5f9;color:var(--navy);text-align:left;padding:8px 10px;font-weight:700;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2;}
  table.rt tbody td{padding:8px 10px;border-bottom:1px solid var(--border);}
  table.rt tbody tr.review{background:#fdf1f0;}
  table.rt tbody tr.warn{background:#fff8ec;}
  table.rt tbody tr.clickable{cursor:pointer;}
  table.rt tbody tr.clickable:hover{background:#eef4ff;}

  .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-weight:700;font-size:11px;white-space:nowrap;}
  .pill.ok{background:#e8f6ee;color:var(--ok);}
  .pill.warn{background:#fff3e0;color:var(--warn);}
  .pill.bad{background:#fbe9e7;color:var(--bad);}
  .pill.neutral{background:#eef2f6;color:var(--navy);}

  .status-pill{display:inline-block;padding:2px 8px;border-radius:10px;font-weight:700;font-size:11px;text-transform:lowercase;letter-spacing:.3px;}
  .status-pill.done{background:#e8f6ee;color:var(--ok);}
  .status-pill.no_det, .status-pill.no_data, .status-pill.no_steta{background:#fbe9e7;color:var(--bad);}
  .status-pill.start, .status-pill.almost, .status-pill.proc, .status-pill.tprev{background:#fff3e0;color:var(--warn);}
  .status-pill.empty{background:#eef2f6;color:var(--muted);}

  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .mono{font-variant-numeric:tabular-nums;color:var(--muted);}
  .scroll-tbl{max-height:60vh;overflow:auto;border:1px solid var(--border);border-radius:8px;}
  .action-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .action-bar .rt-filter{font-size:12px;color:var(--muted);margin-left:auto;}

  .footer-note{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;}
  @media (max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr);} .modal .msum{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">VIAJE OK</div>
  <div class="divider"></div>
  <div class="subtitle">Nivel de Cumplimiento por Planta</div>
  <button class="btn" id="gsRefreshBtn" style="margin-left:auto;" title="Volver a leer la hoja de Google Sheets">
    <span>&#8635;</span> Actualizar
  </button>
  <span id="gsStatus" style="font-size:12px;color:#dfe7ef;margin-left:12px;">Cargando…</span>
</header>

<main>
  <div class="filter-bar" style="gap:16px;">
    <span class="label">Período:</span>
    <label style="font-size:12px;color:var(--navy);">Año
      <select id="yearSel" style="margin-left:4px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;"></select>
    </label>
    <label style="font-size:12px;color:var(--navy);">Mes
      <select id="monthSel" style="margin-left:4px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;">
        <option value="0">Todos</option>
        <option value="1">Enero</option><option value="2">Febrero</option><option value="3">Marzo</option>
        <option value="4">Abril</option><option value="5">Mayo</option><option value="6">Junio</option>
        <option value="7">Julio</option><option value="8">Agosto</option><option value="9">Septiembre</option>
        <option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option>
      </select>
    </label>
    <label style="font-size:12px;color:var(--navy);">Semana
      <select id="weekSel" style="margin-left:4px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;">
        <option value="0">Todas</option>
      </select>
    </label>
    <button class="btn mini secondary" id="clearPeriodBtn">Limpiar período</button>
  </div>

  <div class="filter-bar">
    <span class="label">Filtro · Tipo de Viaje:</span>
    <div id="tipoChips" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
    <button class="btn mini secondary" id="allTiposBtn">Todos</button>
    <button class="btn mini secondary" id="noneTiposBtn">Ninguno</button>
  </div>

  <div class="kpi-row">
    <div class="kpi">
      <div class="value" id="kTotal">0</div>
      <div class="label">Total Viajes</div>
    </div>
    <div class="kpi green">
      <div class="value" id="kOk">0</div>
      <div class="label">Viajes 100% OK</div>
    </div>
    <div class="kpi red">
      <div class="value" id="kRev">0</div>
      <div class="label">Por Revisar</div>
    </div>
    <div class="kpi green">
      <div class="value" id="kPct">0%</div>
      <div class="label">% Cumplimiento</div>
    </div>
  </div>

  <div class="section">
    <h2 style="justify-content:space-between;">
      <span style="display:flex;align-items:center;gap:10px;"><span class="icon">&#9679;</span> Tendencia por Semana</span>
      <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--navy);cursor:pointer;">
        <input type="checkbox" id="trendApplyFilters" /> Aplicar filtros de período
      </label>
    </h2>
    <div id="trendChart"></div>
  </div>

  <div class="section">
    <h2><span class="icon">&#9679;</span> Cumplimiento por Planta</h2>
    <div class="legend" style="justify-content:space-between;align-items:center;">
      <div style="display:flex;flex-wrap:wrap;gap:14px;">
        <span><span class="dot g"></span>Cumple (&ge;98%)</span>
        <span><span class="dot y"></span>Advertencia (85-97.9%)</span>
        <span><span class="dot r"></span>Revisar (&lt;85%)</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" id="plantSearch" placeholder="Buscar planta…"
               style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;width:180px;" />
        <label style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--navy);cursor:pointer;">
          <input type="checkbox" id="onlyReviewChk" /> Solo por revisar
        </label>
        <button class="btn mini" id="exportReviewBtn" title="Descargar viajes por revisar como CSV">&#8595; Exportar por revisar</button>
      </div>
    </div>
    <div class="plants" id="plantsGrid"></div>
  </div>

</main>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <div class="mhead">
      <div>
        <h3 id="modalTitle">Detalle de Planta</h3>
        <div class="breadcrumb" id="modalBreadcrumb"></div>
      </div>
      <button class="close" id="modalClose" aria-label="Cerrar">&times;</button>
    </div>
    <div class="mbody" id="modalBody"></div>
  </div>
</div>

<script>
const BASE_DATA = {"plants":[]};

let currentData = BASE_DATA;
let currentFilter = new Set();
let hadUserToggle = false;
let periodState = {year:0, month:0, week:0};

function collectDates(data){
  const years = new Set(), weeksByYM = {}, allWeeks = new Set();
  for(const p of data.plants) for(const r of p.routes) for(const t of r.trips){
    const w = +t.w;
    if(w) allWeeks.add(w);
    if(!t.d) continue;
    const y = +t.d.slice(0,4), m = +t.d.slice(5,7);
    years.add(y);
    if(!w) continue;
    const key = y+'-'+m;
    (weeksByYM[key] = weeksByYM[key] || new Set()).add(w);
    (weeksByYM[y+'-0'] = weeksByYM[y+'-0'] || new Set()).add(w);
  }
  return {years:[...years].sort(), weeksByYM, allWeeks};
}
function refreshPeriodControls(){
  const info = collectDates(currentData);
  const yearSel = document.getElementById('yearSel');
  const current = periodState.year || 0;
  yearSel.innerHTML = '<option value="0">Todos</option>' + info.years.map(y=>`<option value="${y}" ${y===current?'selected':''}>${y}</option>`).join('');
  const weekSel = document.getElementById('weekSel');
  const key = (periodState.year||0)+'-'+(periodState.month||0);
  const weeks = (periodState.year ? (info.weeksByYM[key] || new Set()) : info.allWeeks);
  const wArr = [...weeks].sort((a,b)=>a-b);
  weekSel.innerHTML = '<option value="0">Todas</option>' + wArr.map(w=>`<option value="${w}" ${w===periodState.week?'selected':''}>Semana ${w}</option>`).join('');
  document.getElementById('monthSel').value = periodState.month;
}
let modalState = null;

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pctColor(p){ if(p>=98)return'ok'; if(p>=85)return'warn'; return'bad'; }
function pctBar(p){ const c = pctColor(p); if(c==='ok')return'var(--ok)'; if(c==='warn')return'var(--warn)'; return'var(--bad)'; }
function statusPillClass(v){
  const key = (v||'').trim();
  if(!key) return 'empty';
  return key.replace(/[^a-z0-9_]/gi,'_');
}
function statusLabel(v){ return (v||'').trim() || '—'; }

function tipoCounts(data){
  const counts = new Map();
  for(const p of data.plants){
    for(const r of p.routes){
      for(const t of r.trips){
        const k = (t.t||'').trim() || '(vacío)';
        counts.set(k, (counts.get(k)||0)+1);
      }
    }
  }
  return counts;
}

function isoWeek(d){
  const dt = new Date(d+'T00:00:00');
  const target = new Date(dt.valueOf());
  const dayNr = (dt.getDay() + 6) % 7;
  target.setDate(target.getDate() - dayNr + 3);
  const firstThursday = target.valueOf();
  target.setMonth(0, 1);
  if (target.getDay() !== 4) target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
  return 1 + Math.ceil((firstThursday - target) / 604800000);
}
function periodMatch(t){
  const dateStr = t.d;
  if(periodState.year || periodState.month){
    if(!dateStr) return false;
    const y = +dateStr.slice(0,4), m = +dateStr.slice(5,7);
    if(periodState.year && y !== periodState.year) return false;
    if(periodState.month && m !== periodState.month) return false;
  }
  if(periodState.week){
    if(+t.w !== periodState.week) return false;
  }
  return true;
}
function aggregate(data, filter){
  const plants = [];
  for(const p of data.plants){
    let pTotal=0, pOk=0;
    const routes = [];
    for(const r of p.routes){
      let total=0, ok=0, sb=0, eb=0, bb=0;
      const kept = [];
      for(const t of r.trips){
        const tipo = (t.t||'').trim() || '(vacío)';
        if(!filter.has(tipo)) continue;
        if(!periodMatch(t)) continue;
        total++;
        kept.push(t);
        const sOk = t.o === 'done';
        const eOk = t.s === 'done';
        if(sOk && eOk) ok++;
        else if(!sOk && !eOk) bb++;
        else if(!sOk) sb++;
        else eb++;
      }
      if(total > 0){
        routes.push({id:r.id, name:r.name, total, ok, start_bad:sb, end_bad:eb, both_bad:bb, trips: kept});
      }
      pTotal += total; pOk += ok;
    }
    if(pTotal > 0){
      plants.push({name:p.name, total:pTotal, ok:pOk, routes});
    }
  }
  return {plants};
}

function renderTipoChips(){
  const counts = tipoCounts(currentData);
  const chipsBox = document.getElementById('tipoChips');
  chipsBox.innerHTML = '';
  if(!hadUserToggle){
    currentFilter = new Set(counts.keys());
  }
  const keys = [...counts.keys()].sort();
  for(const k of keys){
    const chip = document.createElement('span');
    chip.className = 'chip' + (currentFilter.has(k) ? ' on' : '');
    chip.innerHTML = `<span>${escapeHtml(k)}</span><span class="count">${counts.get(k).toLocaleString('es-MX')}</span>`;
    chip.addEventListener('click', ()=>{
      hadUserToggle = true;
      if(currentFilter.has(k)) currentFilter.delete(k);
      else currentFilter.add(k);
      renderTipoChips();
      renderAll();
    });
    chipsBox.appendChild(chip);
  }
}

document.getElementById('allTiposBtn').addEventListener('click', ()=>{
  hadUserToggle = true;
  currentFilter = new Set(tipoCounts(currentData).keys());
  renderTipoChips();
  renderAll();
});
document.getElementById('noneTiposBtn').addEventListener('click', ()=>{
  hadUserToggle = true;
  currentFilter = new Set();
  renderTipoChips();
  renderAll();
});

function weeklyTrend(applyPeriod){
  const byWeek = new Map();
  for(const p of currentData.plants) for(const r of p.routes) for(const t of r.trips){
    const tipo = (t.t||'').trim() || '(vacío)';
    if(!currentFilter.has(tipo)) continue;
    if(applyPeriod && !periodMatch(t)) continue;
    const w = +t.w; if(!w) continue;
    const rec = byWeek.get(w) || {total:0, ok:0};
    rec.total++;
    if(t.o==='done' && t.s==='done') rec.ok++;
    byWeek.set(w, rec);
  }
  return [...byWeek.entries()].map(([w,v])=>({week:w, total:v.total, ok:v.ok, pct:v.total? v.ok/v.total*100:0})).sort((a,b)=>a.week-b.week);
}

function renderTrend(){
  const box = document.getElementById('trendChart');
  if(!box) return;
  const apply = document.getElementById('trendApplyFilters')?.checked;
  const series = weeklyTrend(apply);
  if(series.length === 0){
    box.innerHTML = '<div style="padding:20px;color:var(--muted);font-size:13px;">Sin datos de semana (columna AF) para graficar.</div>';
    return;
  }
  const W=1000, H=260, padL=46, padR=20, padT=20, padB=42;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const yFor = p => padT + (1 - Math.max(0,Math.min(100,p))/100)*plotH;
  const n = series.length;
  const xFor = i => n===1 ? padL+plotW/2 : padL + (i/(n-1))*plotW;
  const line = series.map((d,i)=>`${xFor(i).toFixed(1)},${yFor(d.pct).toFixed(1)}`).join(' ');
  const area = `${padL},${padT+plotH} ${line} ${xFor(n-1).toFixed(1)},${padT+plotH}`;
  const grid = [0,25,50,75,85,98,100];
  const gridLines = grid.map(g=>{
    const y=yFor(g).toFixed(1);
    const ref = (g===98)?'var(--ok)':(g===85?'var(--warn)':'#e4e9ef');
    const dash = (g===98||g===85)?'4 4':'0';
    const lbl = (g===98)?'Cumple':(g===85?'Advertencia':'');
    return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="${ref}" stroke-width="1" stroke-dasharray="${dash}"/>`+
           `<text x="${padL-8}" y="${(+y+4)}" text-anchor="end" font-size="11" fill="var(--muted)">${g}%</text>`+
           (lbl?`<text x="${W-padR}" y="${(+y-4)}" text-anchor="end" font-size="10" fill="${ref}">${lbl}</text>`:'');
  }).join('');
  const dots = series.map((d,i)=>{
    const x=xFor(i), y=yFor(d.pct);
    const col = d.pct>=98?'var(--ok)':(d.pct>=85?'var(--warn)':'var(--bad)');
    const showLbl = n<=20 || i===0 || i===n-1;
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#fff" stroke="${col}" stroke-width="2.5"/>`+
      (showLbl?`<text x="${x.toFixed(1)}" y="${(y-10).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="${col}">${d.pct.toFixed(1)}%</text>`:'');
  }).join('');
  const xLabels = series.map((d,i)=>{
    const every = n>16 ? Math.ceil(n/16) : 1;
    if(i%every!==0 && i!==n-1) return '';
    return `<text x="${xFor(i).toFixed(1)}" y="${H-padB+18}" text-anchor="middle" font-size="11" fill="var(--navy)" font-weight="600">Sem ${d.week}</text>`+
           `<text x="${xFor(i).toFixed(1)}" y="${H-padB+31}" text-anchor="middle" font-size="9" fill="var(--muted)">${d.total.toLocaleString('es-MX')} viajes</text>`;
  }).join('');
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;">
    ${gridLines}
    <polygon points="${area}" fill="var(--green)" fill-opacity="0.12"/>
    <polyline points="${line}" fill="none" stroke="var(--green-dark)" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}
    ${xLabels}
  </svg>`;
}

function parseCSV(text){
  const rows = [];
  let cur = [], val = '';
  let i = 0, inQ = false;
  const n = text.length;
  while(i<n){
    const ch = text[i];
    if(inQ){
      if(ch === '"'){
        if(text[i+1] === '"'){ val += '"'; i+=2; continue; }
        inQ = false; i++; continue;
      } else { val += ch; i++; continue; }
    } else {
      if(ch === '"'){ inQ = true; i++; continue; }
      if(ch === ','){ cur.push(val); val=''; i++; continue; }
      if(ch === '\r'){ i++; continue; }
      if(ch === '\n'){ cur.push(val); rows.push(cur); cur=[]; val=''; i++; continue; }
      val += ch; i++;
    }
  }
  if(val.length || cur.length){ cur.push(val); rows.push(cur); }
  return rows;
}

function processRows(rows){
  if(rows.length < 2) return {plants:[]};
  const header = rows[0];
  const idx = (name, def) => {
    const i = header.findIndex(h => (h||'').trim().toLowerCase() === name.toLowerCase());
    return i >= 0 ? i : def;
  };
  const aId    = 0;
  const dDes   = idx('des', 3);
  const eTipo  = idx('Tipo de Viaje', 4);
  const fRoute = idx('ID Ruta', 5);
  const jShift = idx('shift', 9);
  const kGroup = idx('group', 10);
  const lDate  = idx('start_date', 11);
  const mTime  = idx('start_time', 12);
  const oStart = idx('start_status', 14);
  const qTime  = idx('end_time', 16);
  const sEnd   = idx('end_status', 18);
  const opCol  = idx('operador', 28);

  const EXCL = 'GRUPO VIAJES ESPECIALES - set_gar';
  const map = new Map();
  const maxIdx = Math.max(jShift,kGroup,oStart,sEnd,fRoute,dDes,eTipo,aId,lDate,mTime,qTime,opCol);
  for(let r=1; r<rows.length; r++){
    const row = rows[r];
    if(!row || row.length <= maxIdx) continue;
    const shift = (row[jShift]||'').trim();
    const group = (row[kGroup]||'').trim();
    const startS = (row[oStart]||'').trim();
    const endS = (row[sEnd]||'').trim();
    const route = (row[fRoute]||'').trim() || '(sin ruta)';
    const des = (row[dDes]||'').trim();
    const tipo = (row[eTipo]||'').trim();
    const id = (row[aId]||'').trim();
    const d = (row[lDate]||'').trim();
    const st = (row[mTime]||'').trim();
    const et = (row[qTime]||'').trim();
    const op = (row[opCol]||'').trim();
    // Número de semana calculado desde la fecha (semana inicia en lunes, ISO)
    const wk = /^\d{4}-\d{2}-\d{2}/.test(d) ? String(isoWeek(d)) : '';
    if(shift !== 'IN') continue;
    if(group === EXCL) continue;
    if(!group) continue;
    if(!map.has(group)) map.set(group, new Map());
    const rmap = map.get(group);
    if(!rmap.has(route)) rmap.set(route, {id:route, name:des||route, trips:[]});
    const rec = rmap.get(route);
    if(des && (!rec.name || rec.name === route)) rec.name = des;
    rec.trips.push({i:id, d, st, et, t:tipo, o:startS, s:endS, op, w:wk});
  }
  const plants = [];
  for(const [name, rmap] of map){
    const routes = [];
    for(const rec of rmap.values()) routes.push(rec);
    plants.push({name, routes});
  }
  plants.sort((a,b)=>a.name.localeCompare(b.name));
  return {plants};
}


/* ====== Google Sheets fetch ====== */
function buildSheetUrls(id, tab){
  const enc = encodeURIComponent(tab);
  return [
    `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${enc}`,
    `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1&sheet=${enc}`,
  ];
}

async function fetchGoogleSheet(id, tab){
  const urls = buildSheetUrls(id, tab);
  let lastErr = null;
  for(const url of urls){
    try{
      const res = await fetch(url, {method:'GET', credentials:'omit', redirect:'follow'});
      if(!res.ok){
        lastErr = new Error('HTTP ' + res.status + ' — la hoja no está pública o la pestaña no existe');
        continue;
      }
      const text = await res.text();
      if(text.trim().startsWith('<') || text.includes('accounts.google.com')){
        lastErr = new Error('La hoja pide inicio de sesión — hazla pública o descárgala como CSV');
        continue;
      }
      return text;
    }catch(e){
      lastErr = e;
    }
  }
  throw lastErr || new Error('No se pudo descargar la hoja');
}

async function loadFromGoogleSheet(){
  const id = document.getElementById('gsIdInput').value.trim();
  const tab = document.getElementById('gsTabInput').value.trim();
  const status = document.getElementById('gsStatus');
  const fileInfo = document.getElementById('fileInfo');
  if(!id || !tab){
    status.innerHTML = '<span style="color:var(--bad);">Falta ID o pestaña</span>';
    return;
  }
  status.textContent = 'Descargando ' + tab + '…';
  try{
    const text = await fetchGoogleSheet(id, tab);
    const rows = parseCSV(text);
    if(rows.length < 2){
      status.innerHTML = '<span style="color:var(--bad);">La hoja llegó vacía</span>';
      return;
    }
    const data = processRows(rows);
    if(!data.plants.length){
      status.innerHTML = '<span style="color:var(--warn);">Sin viajes IN válidos en la pestaña ' + escapeHtml(tab) + '</span>';
      return;
    }
    currentData = data;
    currentFilter = new Set();
    hadUserToggle = false;
    renderTipoChips();
    renderAll();
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0'), mm = String(now.getMinutes()).padStart(2,'0');
    status.innerHTML = '<span style="color:var(--ok);">&#10003; Actualizado ' + hh + ':' + mm + '</span>';
    fileInfo.textContent = 'Google Sheets · pestaña "' + tab + '" · ' + data.plants.length + ' plantas · ' + (rows.length-1).toLocaleString('es-MX') + ' filas leídas';
    document.getElementById('badgeSource').textContent = 'Google Sheets · ' + tab;
  }catch(err){
    console.error(err);
    status.innerHTML = '<span style="color:var(--bad);">Error: ' + escapeHtml(err.message) + '</span>';
    fileInfo.innerHTML = 'No se pudo descargar. Comparte la hoja como <b>"Cualquier persona con el enlace · Lector"</b>, o descárgala como CSV y usa "Viajes facturación para Viajes ok".';
  }
}

function exportReviewCsv(){
  const agg = aggregate(currentData, currentFilter);
  const lines = ['Planta,Ruta,ID Ruta,Fecha,Hora Inicio,Hora Fin,Tipo,ID Viaje,Operador,Estatus Inicio (O),Estatus Fin (S),Calificación'];
  const csvEsc = (v)=>{
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  for(const p of agg.plants){
    for(const r of p.routes){
      for(const t of r.trips){
        const so = t.o === 'done', se = t.s === 'done';
        if(so && se) continue;
        let cal;
        if(!so && !se) cal = 'Ambos malos';
        else if(!so) cal = 'Inicio malo';
        else cal = 'Fin malo';
        lines.push([p.name, r.name, r.id, t.d, t.st, t.et, t.t, t.i, t.op, t.o, t.s, cal].map(csvEsc).join(','));
      }
    }
  }
  const blob = new Blob(["﻿" + lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const stamp = new Date().toISOString().slice(0,10).replace(/-/g,'');
  a.download = 'viajes_por_revisar_' + stamp + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Convierte una celda gviz a texto plano (fechas -> YYYY-MM-DD, horas -> HH:MM)
function gvizCell(cell){
  if(cell == null) return '';
  const v = cell.v;
  if(typeof v === 'string'){
    const m = v.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
    if(m){
      const Y = +m[1];
      if(Y < 1900){ // hora del día
        return String(+m[4]||0).padStart(2,'0') + ':' + String(+m[5]||0).padStart(2,'0');
      }
      return Y + '-' + String(+m[2]+1).padStart(2,'0') + '-' + String(+m[3]).padStart(2,'0');
    }
  }
  if(cell.f != null) return String(cell.f);
  if(v != null) return String(v);
  return '';
}

function showDiag(rows){
  const header = rows[0]||[];
  const colVals = (i)=>{
    const m = new Map();
    for(let r=1;r<rows.length;r++){ const v=(((rows[r]||[])[i])||'').toString().trim(); m.set(v,(m.get(v)||0)+1); }
    return [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,8).map(([v,n])=>`"${v||'(vacío)'}": ${n.toLocaleString('es-MX')}`).join(' · ');
  };
  const grid = document.getElementById('plantsGrid');
  grid.innerHTML = `<div style="padding:16px;font-size:12px;line-height:1.8;color:var(--text);background:#fff8ec;border:1px solid #f0d9a8;border-radius:8px;">
    <b>Diagnóstico — ${(rows.length-1).toLocaleString('es-MX')} filas leídas de "viajes fact"</b><br>
    <b>Encabezados detectados:</b> ${header.map((h,i)=>`[${i}] ${escapeHtml(h||'')}`).join(' · ')}<br>
    <b>Col J (índice 9):</b> ${escapeHtml(colVals(9))}<br>
    <b>Col K (índice 10):</b> ${escapeHtml(colVals(10))}<br>
    <b>Col E (índice 4):</b> ${escapeHtml(colVals(4))}<br>
    <span style="color:var(--muted);">Mándame una captura de esto y ajusto el mapeo exacto.</span>
  </div>`;
}

function loadFromSheet(){
  const status = document.getElementById('gsStatus');
  status.style.color = '#dfe7ef';
  status.textContent = 'Descargando hoja…';
  const cbName = '__gviz_cb_' + Date.now();
  let script = null, timer = null;
  const cleanup = ()=>{ try{ delete window[cbName]; }catch(e){ window[cbName]=undefined; } if(script) script.remove(); if(timer) clearTimeout(timer); };
  const fail = (msg)=>{ cleanup(); status.style.color = '#ff6b6b'; status.textContent = 'Error: ' + msg; };

  window[cbName] = function(resp){
    try{
      cleanup();
      if(!resp) throw new Error('Sin respuesta de Google');
      if(resp.status === 'error'){
        throw new Error('Google: ' + (resp.errors||[]).map(e=>e.detailed_message||e.message||e.reason).join('; '));
      }
      if(!resp.table || !resp.table.cols) throw new Error('status=' + resp.status + ' · claves=' + Object.keys(resp).join(',') + ' (¿gid o compartición?)');
      const table = resp.table;
      const header = table.cols.map(c => (c.label||'').trim());
      const rows = [header];
      for(const r of table.rows){ rows.push((r.c||[]).map(gvizCell)); }
      const data = processRows(rows);
      const trips = data.plants.reduce((a,p)=>a+p.routes.reduce((b,r)=>b+r.trips.length,0),0);
      if(!trips){ status.style.color='#ffb020'; status.textContent = (rows.length-1).toLocaleString('es-MX') + ' filas, pero 0 viajes IN'; showDiag(rows); return; }
      currentData = data;
      currentFilter = new Set();
      hadUserToggle = false;
      periodState = {year:0, month:0, week:0};
      refreshPeriodControls();
      renderTipoChips();
      renderAll();
      const now = new Date();
      status.style.color = '#a4d520';
      status.textContent = '✓ ' + (rows.length-1).toLocaleString('es-MX') + ' filas · ' + trips.toLocaleString('es-MX') + ' viajes IN · ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
    }catch(err){ fail(err.message); }
  };

  const params = 'tqx=out:json;responseHandler:' + cbName + '&headers=1&t=' + Date.now() + (GS_GID ? '&gid=' + encodeURIComponent(GS_GID) : '');
  script = document.createElement('script');
  script.src = 'https://docs.google.com/spreadsheets/d/' + GS_ID + '/gviz/tq?' + params;
  script.onerror = ()=> fail('No se pudo cargar (¿la hoja es pública "cualquiera con el vínculo"?)');
  timer = setTimeout(()=> fail('Tiempo agotado leyendo la hoja'), 30000);
  document.body.appendChild(script);
}
document.getElementById('gsRefreshBtn').addEventListener('click', loadFromSheet);

/* ====== Period selectors ====== */
refreshPeriodControls();
document.getElementById('yearSel').addEventListener('change', (e)=>{
  periodState.year = +e.target.value;
  periodState.week = 0;
  refreshPeriodControls();
  renderAll();
});
document.getElementById('monthSel').addEventListener('change', (e)=>{
  periodState.month = +e.target.value;
  periodState.week = 0;
  refreshPeriodControls();
  renderAll();
});
document.getElementById('weekSel').addEventListener('change', (e)=>{
  periodState.week = +e.target.value;
  renderAll();
});
document.getElementById('clearPeriodBtn').addEventListener('click', ()=>{
  periodState = {year:0, month:0, week:0};
  refreshPeriodControls();
  renderAll();
});

renderTipoChips();
renderAll();
loadFromSheet();
</script>
