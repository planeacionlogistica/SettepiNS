<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ranking Garcia — Vivo desde Drive</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230f1a2e'/><text x='50%25' y='54%25' text-anchor='middle' dominant-baseline='middle' font-family='Segoe UI,Arial,sans-serif' font-size='34' font-weight='800' fill='%237dd858'>R</text></svg>">
<style> 
  :root{
    --navy:#0f1a2e; --navy-2:#182338; --navy-3:#213047;
    --green:#7dd858; --green-dark:#4fae2e;
    --red:#e34f4f; --red-dark:#c53030; --amber:#e0a800;
    --ink:#0f1a2e; --ink-2:#4a5468; --muted:#8a94a6;
    --border:#e5e8ee; --surface:#f5f7fa; --card:#ffffff;
    --shadow: 0 1px 2px rgba(15,26,46,.05), 0 4px 12px rgba(15,26,46,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--surface);}
  .topbar{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,.15);position:sticky;top:0;z-index:20;}
  .brand{font-weight:800;color:var(--green);font-size:20px;letter-spacing:.5px}
  .brand-sep{color:#3a4459;font-size:20px}
  .brand-sub{font-weight:600;color:#fff;font-size:16px}
  .top-right{margin-left:auto;font-size:13px;color:#a7b0c2}
  .view-switch{background:#182338;border-radius:999px;padding:4px;display:inline-flex;gap:2px;margin-left:24px}
  .view-switch button{background:transparent;border:none;color:#a7b0c2;padding:8px 18px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:all .15s;}
  .view-switch button:hover{color:#fff}
  .view-switch button.active{background:var(--green);color:#0f1a2e}
  .layout{display:grid;grid-template-columns:240px 1fr;gap:20px;padding:20px;max-width:1800px;margin:0 auto}
  .sidebar{display:flex;flex-direction:column;gap:14px}
  .filters-title{font-weight:700;letter-spacing:.5px;color:var(--ink-2);font-size:13px;display:flex;align-items:center;justify-content:space-between;padding:0 4px}
  .reset-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:4px}
  .reset-btn:hover{color:var(--ink);background:#eef1f6}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--ink-2)}
  .field select,.field input[type=text]{background:#eef1f6;border:1px solid transparent;border-radius:8px;padding:9px 12px;font-size:13px;color:var(--ink);outline:none;transition:.15s;}
  .field select:focus,.field input[type=text]:focus{border-color:var(--green);background:#fff}
  .clear-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink);cursor:pointer;font-weight:600;margin-top:4px;}
  .clear-btn:hover{background:#eef1f6}
  .main{display:flex;flex-direction:column;gap:16px;min-width:0}
  .period{background:var(--navy);color:#fff;border-radius:10px;padding:14px 20px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:16px}
  .period .label{font-size:11px;letter-spacing:1.2px;color:#a7b0c2;font-weight:700;text-transform:uppercase;margin-bottom:4px}
  .period .value{font-size:22px;font-weight:800;color:var(--green)}
  .highlights{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .hcard{background:var(--card);border-radius:10px;padding:18px 22px;box-shadow:var(--shadow);border-top:4px solid var(--green);position:relative;overflow:hidden;min-height:120px;display:flex;flex-direction:column;justify-content:center;}
  .hcard.bad{border-top-color:var(--red)}
  .hcard .big{font-size:44px;font-weight:800;color:var(--green);line-height:1;margin:0;}
  .hcard.bad .big{color:var(--red)}
  .hcard .cap{font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;margin-top:6px;}
  .hcard .name{font-size:16px;font-weight:700;color:var(--ink);margin-top:8px;}
  .hcard .udn{font-size:12px;color:var(--muted);margin-top:2px;}
  .card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .card-header{padding:14px 20px 10px;display:flex;align-items:center;gap:10px}
  .card-header .icon svg{width:20px;height:20px;color:var(--ink-2)}
  .card-title{font-weight:700;font-size:15px;color:var(--ink);margin:0}
  .card-sub{color:var(--muted);font-size:12px;margin-top:2px}
  .card-header .header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
  .excel-btn{display:inline-flex;align-items:center;gap:6px;background:#1f7a3a;color:#fff;border:1px solid #1a6631;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;letter-spacing:.2px;box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .excel-btn:hover{background:#186731;border-color:#12522a}
  .excel-btn:active{transform:translateY(1px)}
  .excel-btn svg{width:16px;height:16px}
  @media (max-width:640px){
    .excel-btn{padding:7px 10px;font-size:12px}
    .excel-btn .lbl{display:none}
  }
  .tabs{display:flex;gap:4px;padding:6px 20px 0;border-bottom:1px solid var(--border)}
  .tab{padding:8px 18px;border-radius:8px 8px 0 0;background:transparent;border:1px solid transparent;border-bottom:none;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;position:relative;top:1px;}
  .tab:hover{color:var(--ink)}
  .tab.active{background:#fff;border-color:var(--border);color:var(--ink);}
  .tab .count{margin-left:6px;background:#eef1f6;color:var(--muted);padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}
  .tab.active .count{background:var(--green);color:#0f1a2e}
  .table-wrap{overflow-x:auto;max-height:75vh;overflow-y:auto}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  thead th{background:var(--navy);color:#fff;font-weight:700;text-align:left;padding:12px 10px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;position:sticky;top:0;z-index:5;}
  thead th.num{text-align:right}
  thead th.subtotal{background:var(--navy-3);border-left:2px solid var(--green);color:#fff}
  tbody td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
  tbody tr.coord-row{cursor:pointer}
  tbody tr.coord-row:hover{background:#f4f8ff}
  tbody tr.op-row{background:#fafbfd}
  tbody tr.op-row td{color:var(--ink-2);font-size:12px;padding:8px 10px}
  tbody tr.op-row td.op-name{padding-left:40px;font-weight:600;color:var(--ink)}
  tbody tr.op-row td.op-total{color:var(--green-dark);font-weight:700;text-align:right}
  td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--green-dark);font-weight:700}
  td.num.score{color:var(--ink);font-weight:600}
  td.num.dash{color:var(--muted);font-weight:400}
  td.pos{width:52px;text-align:center;font-weight:700;color:var(--ink-2)}
  .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-weight:800;font-size:13px;line-height:1;border:2px solid;box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .rank-badge.gold{background:linear-gradient(135deg,#f7d76a 0%,#c8961f 100%);border-color:#8a5f10;color:#3d2a05;}
  .rank-badge.silver{background:linear-gradient(135deg,#f2f2f2 0%,#a8a8a8 100%);border-color:#6a6a6a;color:#2d2d2d;}
  .rank-badge.bronze{background:linear-gradient(135deg,#e8a877 0%,#8d4a1f 100%);border-color:#5a2d10;color:#2a1200;}
  .rank-num{display:inline-block;font-weight:700;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;}
  td.coord{font-weight:700;color:var(--ink);letter-spacing:.3px;white-space:nowrap}
  td.planta{color:var(--ink-2);font-size:12px;max-width:260px;white-space:normal;word-wrap:break-word;line-height:1.35}
  td.udn{color:var(--ink-2);font-size:12px;white-space:nowrap}
  td.nomina{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
  td.subtotal{background:#fffef0;color:var(--green-dark);font-weight:800;border-left:2px solid #f2e8b8;text-align:right}
  .no-data{padding:32px;text-align:center;color:var(--muted)}
  .zona-chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;background:#e8f5e0;color:var(--green-dark);letter-spacing:.3px;margin-left:6px;}
  .zona-chip.garcia{background:#e0e9f7;color:#2c5aa0}
  .toggle-caret{display:inline-block;width:14px;color:var(--muted);cursor:pointer;user-select:none;font-size:11px;margin-right:4px}
  .toggle-caret.open{color:var(--green-dark)}
  .tip-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#f0f5ff;border:1px solid #d5e0f0;color:#2c5aa0;cursor:pointer;font-size:12px;margin-left:8px;transition:.15s;padding:0;vertical-align:middle;}
  .tip-btn:hover{background:#2c5aa0;color:#fff;border-color:#2c5aa0}
  .tip-btn svg{width:13px;height:13px;display:block}
  .icon-btn-svg{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;vertical-align:middle;}
  .modal{max-width:1100px !important}
  .top3-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:8px;}
  .top3-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;min-width:900px;}
  .top3-table thead th{background:var(--navy);color:#fff;padding:10px 8px;text-align:left;font-size:10px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;white-space:nowrap;}
  .top3-table thead th.num{text-align:right}
  .top3-table thead th.total-col{background:var(--navy-3);border-left:2px solid var(--green);}
  .top3-table tbody td{padding:11px 8px;border-bottom:1px solid var(--border);vertical-align:middle;background:#fff;}
  .top3-table tbody tr:last-child td{border-bottom:none}
  .top3-table tbody td.rank-cell{text-align:center;width:44px;padding:8px}
  .top3-table tbody td.op-nm{font-weight:700;color:var(--ink);white-space:nowrap;}
  .top3-table tbody td.op-nm .op-nom{display:block;font-weight:500;color:var(--muted);font-size:10px;margin-top:2px;font-variant-numeric:tabular-nums;}
  .top3-table tbody td.planta-cell{color:var(--ink-2);font-size:11px;white-space:nowrap;}
  .top3-table tbody td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;}
  .top3-table tbody td.num.dash{color:var(--muted);font-weight:400}
  .top3-table tbody td.total-cell{text-align:right;font-weight:800;color:var(--green-dark);font-variant-numeric:tabular-nums;background:#fffef0 !important;border-left:2px solid #f2e8b8;}
  @media (max-width:780px){
    .top3-table{min-width:760px;font-size:11px}
    .top3-table thead th{padding:8px 6px;font-size:9px}
    .top3-table tbody td{padding:9px 6px}
  }
  .modal-overlay{position:fixed;inset:0;background:rgba(15,26,46,.5);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.open{display:flex}
  .modal{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal-header{padding:20px 24px;background:var(--navy);color:#fff;border-radius:12px 12px 0 0;display:flex;align-items:center;justify-content:space-between;}
  .modal-title{font-size:16px;font-weight:800;margin:0}
  .modal-sub{font-size:12px;color:#a7b0c2;margin-top:2px}
  .modal-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 4px;line-height:1}
  .modal-body{padding:20px 24px}
  .score-hero{background:#f8f9fb;border-radius:10px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .score-hero .lbl{font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:700;text-transform:uppercase}
  .score-hero .val{font-size:28px;font-weight:800;color:var(--green-dark)}
  .rec-section{margin-bottom:18px}
  .rec-title{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .rec-title.good{color:var(--green-dark)}
  .rec-title.bad{color:var(--red-dark)}
  .rec-title.info{color:#2c5aa0}
  .rec-item{background:#f8f9fb;border-left:3px solid var(--muted);padding:10px 14px;margin-bottom:6px;border-radius:0 8px 8px 0;font-size:13px;color:var(--ink);line-height:1.4;}
  .rec-item.good{border-left-color:var(--green);background:#f4fbef}
  .rec-item.bad{border-left-color:var(--red);background:#fdf3f3}
  .rec-item .metric{font-weight:800;margin-right:6px}
  .rec-item .val{color:var(--muted);font-variant-numeric:tabular-nums}
  .rec-item .comment{display:block;margin-top:4px;color:var(--ink-2);font-size:12px}
  .rec-empty{color:var(--muted);font-style:italic;font-size:13px;padding:8px 0}
  /* Mobile toggle */
  .mobile-menu-btn{display:none;background:transparent;border:1px solid #3a4459;color:#fff;border-radius:8px;padding:6px 10px;font-size:18px;cursor:pointer;margin-left:auto}

  /* Tablet */
  @media (max-width: 1100px){
    .layout{grid-template-columns:220px 1fr;gap:14px;padding:14px}
    thead th, tbody td{padding:9px 8px;font-size:12px}
    .hcard .big{font-size:36px}
  }

  /* Mobile */
  @media (max-width: 780px){
    .topbar{padding:10px 14px;gap:8px;flex-wrap:wrap}
    .brand{font-size:16px}
    .brand-sep{font-size:16px}
    .brand-sub{font-size:13px}
    .view-switch{margin-left:0;order:3;width:100%;justify-content:center;padding:3px}
    .view-switch button{padding:6px 14px;font-size:12px;flex:1}
    .top-right{display:none}
    .mobile-menu-btn{display:inline-block}

    .layout{grid-template-columns:1fr;gap:12px;padding:12px}
    .sidebar{
      position:fixed;top:0;left:-100%;bottom:0;width:280px;max-width:85vw;
      background:#fff;z-index:50;padding:16px;overflow-y:auto;
      box-shadow:2px 0 20px rgba(0,0,0,.15);transition:left .25s;
    }
    .sidebar.open{left:0}
    .sidebar-backdrop{
      position:fixed;inset:0;background:rgba(15,26,46,.4);z-index:49;
      display:none;
    }
    .sidebar-backdrop.open{display:block}

    .highlights{grid-template-columns:1fr;gap:10px}
    .hcard{padding:14px 16px;min-height:auto}
    .hcard .big{font-size:32px}
    .hcard .cap{font-size:10px}
    .hcard .name{font-size:14px;margin-top:6px}
    .hcard .udn{font-size:11px}

    .period{padding:10px 14px}
    .period .value{font-size:18px}
    .period .label{font-size:10px}

    .card-header{padding:12px 14px 8px}
    .card-title{font-size:14px}
    .card-sub{font-size:11px}
    .tabs{padding:4px 10px 0;overflow-x:auto}
    .tab{padding:7px 12px;font-size:12px;white-space:nowrap;flex-shrink:0}

    .table-wrap{max-height:60vh}
    thead th{padding:8px 6px;font-size:10px;letter-spacing:.3px}
    tbody td{padding:8px 6px;font-size:11px}
    td.coord{white-space:normal;font-size:12px}
    td.planta{max-width:120px;font-size:10px}
    td.udn{font-size:10px}
    td.pos{width:38px}
    .rank-badge{width:26px;height:26px;font-size:11px;border-width:1.5px}
    .rank-num{font-size:11px}
    .zona-chip{font-size:9px;padding:1px 5px;margin-left:4px}
    .top3-metrics{grid-template-columns:repeat(3,1fr)}
    .top3-total{font-size:18px}
    .top3-nm{font-size:13px}
    .top3-card{padding:10px 12px}
    .mt-val{font-size:12px}
    .tip-btn{width:20px;height:20px;font-size:10px;margin-left:4px}
    tbody tr.op-row td.op-name{padding-left:20px}

    .modal{max-height:90vh}
    .modal-header{padding:14px 16px}
    .modal-title{font-size:14px}
    .modal-body{padding:14px 16px}
    .score-hero{padding:10px 12px}
    .score-hero .val{font-size:22px}
    .rec-item{padding:8px 10px;font-size:12px}
  }

  @media (max-width: 480px){
    .brand-sub{display:none}
    thead th{font-size:9px;padding:7px 5px}
    tbody td{font-size:10px;padding:7px 5px}
    td.coord{font-size:11px}
    td.planta{max-width:90px}
    .highlights{gap:8px}
    .hcard .big{font-size:28px}
    .top3-metrics{grid-template-columns:repeat(2,1fr)}
    .rank-badge{width:24px;height:24px;font-size:10px}
    .modal-header{padding:12px 14px}
    .modal-body{padding:12px 14px}
    .top3-card{padding:10px}
    .layout{padding:8px;gap:8px}
    .period{padding:8px 12px}
    .period .value{font-size:16px}
    .field select,.field input[type=text]{padding:8px 10px;font-size:12px}
  }
  @media (max-width: 360px){
    .top3-metrics{grid-template-columns:1fr 1fr}
    .mt-lbl{font-size:8px}
    .mt-val{font-size:11px}
    thead th{font-size:8px;padding:6px 4px}
    tbody td{font-size:9px;padding:6px 4px}
  }

.live-banner{max-width:1800px;margin:8px auto 0;padding:8px 20px;border-radius:8px;font-size:12px;font-weight:600;letter-spacing:.2px;}
.live-banner.loading{background:#f0f5ff;color:#2c5aa0;border:1px solid #d5e0f0;}
.live-banner.ok{background:#f0faec;color:#3d7a1a;border:1px solid #cdeabd;}
.live-banner.err{background:#fdecec;color:#a02525;border:1px solid #f2c3c3;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">RANKING</div>
  <div class="brand-sep">|</div>
  <div class="brand-sub" id="brandSub">Coordinadores</div>
  <div class="view-switch" id="viewSwitch">
    <button data-view="coord" class="active">Coordinadores</button>
    <button data-view="op">Operadores</button>
  </div>
  <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Abrir filtros"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="top-right" id="topRight"></div>
</div>

<div id="liveBanner" class="live-banner loading">Iniciando…</div>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="layout">
  <aside class="sidebar">
    <div class="filters-title"><span>FILTROS</span><button class="reset-btn" id="resetBtn" title="Restablecer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button></div>
    <div class="field"><label>SEMANA</label><select id="fSemana"><option value="">Todas</option></select></div>
    <div class="field"><label>ZONA</label>
      <select id="fZona"><option value="">Todas</option><option value="Cienega">Cienega</option><option value="Garcia">Garcia</option></select>
    </div>
    <div class="field"><label id="lblEntity">COORDINADOR</label><select id="fEntity"><option value="">Todos</option></select></div>
    <div class="field"><label>PLANTA</label><select id="fPlanta"><option value="">Todas</option></select></div>
    <div class="field" id="fCoordWrap" style="display:none"><label>COORDINADOR</label><select id="fCoord"><option value="">Todos</option></select></div>
    <div class="field" id="fJefeWrap" style="display:none"><label>JEFE</label><select id="fJefe"><option value="">Todos</option></select></div>
    <div class="field"><label>BUSCAR</label><input type="text" id="fSearch" placeholder="Nombre, planta, nómina"></div>
    <button class="clear-btn" id="clearBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg> Limpiar filtros</button>
  </aside>

  <div class="main">

      <div><div class="label">Período seleccionado</div><div class="value" id="periodLabel">Todas las semanas</div></div>

]);

function csvGvizUrl(sheetName){
  return "https://docs.google.com/spreadsheets/d/"+SHEET_ID
    +"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(sheetName)
    +"&_="+Date.now();
}

// Minimal RFC 4180 CSV parser (handles quoted fields and doubled quotes)
function parseCSV(text){
  const rows=[]; let row=[], field="", inQ=false;
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if (inQ){
      if (ch === '"'){
        if (text[i+1] === '"'){ field+='"'; i++; }
        else inQ=false;
      } else field+=ch;
    } else {
      if (ch === '"') inQ=true;
      else if (ch === ','){ row.push(field); field=""; }
      else if (ch === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if (ch === '\r'){ /* skip */ }
      else field+=ch;
    }
  }
  if (field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || (r.length===1 && r[0]!==""));
}

function toNum(s){
  if (s===null || s===undefined) return null;
  const t = String(s).trim();
  if (t === "" || t === "-" || t === "–") return null;
  const n = Number(t.replace(/,/g,""));
  return isNaN(n) ? null : n;
}

async function fetchSheetCSV(sheetName){
  const url = csvGvizUrl(sheetName);
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP "+r.status+" en "+sheetName);
  const text = await r.text();
  return parseCSV(text);
}

// Aplica: assigns operators to their coord using Asignacion (source of truth),
// orders operators (Total ↓, Score Seg ↓, %Score Seg ↓) — top 3 per coord,
// orders coordinators (Subtotal ↓, Score Seg ↓, %Score Seg ↓).
function buildRanking(asigRows, opsRows, coordRows){
  // ---- Asignacion → nomina -> {coord, jefe, planta} ----
  // Headers row 0: Planta,Ruta,Planta,Lat Ruta,Long Ruta,Jefe,Coordinador,Id Veh,Nomina Operador,Nombre Operador,Lat Op,Long Op
  const asigByNom = new Map();
  for (let i=1;i<asigRows.length;i++){
    const r = asigRows[i]; if (!r || !r[8]) continue;
    const nom = String(r[8]).trim();
    if (!nom) continue;
    if (!asigByNom.has(nom)){
      asigByNom.set(nom, {
        coord: (r[6]||"").trim(),
        jefe:  (r[5]||"").trim(),
        planta:(r[0]||"").trim(),
      });
    }
  }

  // ---- Ranking Operadores ----
  // Headers: #,Operador,Nómina,Planta,Coordinador,Jefe,UDN,% NS Inicio,% NS Llegada,Calidad Ruta,Score Seguridad,% Score Seguridad,Rendimiento,Score Rendimiento,TOTAL,Semana
  const ops = [];
  const groups = new Map(); // coord -> [op]
  for (let i=1;i<opsRows.length;i++){
    const r = opsRows[i]; if (!r || !r[1]) continue;
    const op = {
      operador:      (r[1]||"").trim(),
      nomina:        String(r[2]||"").trim(),
      planta:        (r[3]||"").trim(),
      coordinador:   (r[4]||"").trim(),
      jefe:          (r[5]||"").trim(),
      udn:           (r[6]||"").trim(),
      ns_inicio:     toNum(r[7]),
      ns_llegada:    toNum(r[8]),
      calidad_ruta:  toNum(r[9]),
      score_seg:     toNum(r[10]),
      pct_score_seg: toNum(r[11]),
      rendimiento:   toNum(r[12]),
      score_rend:    toNum(r[13]),
      total:         toNum(r[14]),
      semana:        toNum(r[15]) || 0,
    };
    // Override coord/jefe with Asignacion if operator exists there
    const a = asigByNom.get(op.nomina);
    if (a){
      op.coordinador = a.coord;
      op.jefe = a.jefe;
      groups.set(a.coord, [...(groups.get(a.coord)||[]), op]);
    }
    op.zona = zonaOf(op.coordinador);
    ops.push(op);
  }
  const opCmp = (a,b) => {
    const at = a.total ?? -1e9, bt = b.total ?? -1e9;
    if (bt !== at) return bt - at;
    const as = a.score_seg ?? -1e9, bs = b.score_seg ?? -1e9;
    if (bs !== as) return bs - as;
    const ap = a.pct_score_seg ?? -1e9, bp = b.pct_score_seg ?? -1e9;
    return bp - ap;
  };
  ops.sort(opCmp);
  for (const [k,arr] of groups){ arr.sort(opCmp); }

  // ---- Ranking Coordinador ----
  // Headers: #,Coordinador,Planta,UDN,% NS Inicio,% NS Llegada,Calidad Ruta,Score Seguridad,% Score Seguridad,Rend. Camión,Rend. Camioneta,Score Rendimiento,Subtotal,KMV,HD,TOTAL
  const coords = [];
  for (let i=1;i<coordRows.length;i++){
    const r = coordRows[i]; if (!r || !r[1]) continue;
    const c = {
      coordinador:    (r[1]||"").trim(),
      planta:         (r[2]||"").trim(),
      udn:            (r[3]||"").trim(),
      ns_inicio:      toNum(r[4]),
      ns_llegada:     toNum(r[5]),
      calidad_ruta:   toNum(r[6]),
      score_seg:      toNum(r[7]),
      pct_score_seg:  toNum(r[8]),
      rend_camion:    toNum(r[9]),
      rend_camioneta: toNum(r[10]),
      score_rend:     toNum(r[11]),
      subtotal:       toNum(r[12]),
      total:          toNum(r[15]),
      semana:         (opsRows[1] && toNum(opsRows[1][15])) || 30,
    };
    c.zona = zonaOf(c.coordinador);
    const group = groups.get(c.coordinador) || [];
    c.top3 = group.slice(0,3).map(o => ({
      nombre: o.operador, nomina: o.nomina, planta: o.planta, total: o.total
    }));
    coords.push(c);
  }
  coords.sort((a,b) => {
    const as = a.subtotal ?? -1e9, bs = b.subtotal ?? -1e9;
    if (bs !== as) return bs - as;
    const asg = a.score_seg ?? -1e9, bsg = b.score_seg ?? -1e9;
    if (bsg !== asg) return bsg - asg;
    const ap = a.pct_score_seg ?? -1e9, bp = b.pct_score_seg ?? -1e9;
    return bp - ap;
  });

  return { coords, ops };
}

async function loadFromDrive(){
  const banner = document.getElementById("liveBanner");
  const btn = document.getElementById("refreshBtn");
  if (banner){ banner.textContent = "Cargando datos del Drive…"; banner.className = "live-banner loading"; }
  if (btn) btn.disabled = true;
  try {
    const [asig, opsRows, coordRows] = await Promise.all([
      fetchSheetCSV("Asignacion"),
      fetchSheetCSV("Ranking Operadores"),
      fetchSheetCSV("Ranking Coordinador"),
    ]);
    const { coords, ops } = buildRanking(asig, opsRows, coordRows);
    DATA.coords = coords;
    DATA.operators = ops;
    if (banner){
      const ts = new Date().toLocaleString("es-MX", { dateStyle:"medium", timeStyle:"short" });
      banner.textContent = "Datos actualizados del Drive — " + ts;
      banner.className = "live-banner ok";
    }
    // Trigger re-render if the app has already booted
    if (typeof refreshFilters === "function") refreshFilters();
    if (typeof render === "function") render();
  } catch(e){
    console.error(e);
    if (banner){
      banner.textContent = "Error cargando el Drive: " + (e.message || e);
      banner.className = "live-banner err";
    }
  } finally {
    if (btn) btn.disabled = false;
  }
}

function currentDataset(){ return state.view === "coord" ? DATA.coords : DATA.operators; }
function sortKey(r){ return state.view === "coord" ? r.subtotal : r.total; }
function populateSelect(id, values, placeholder){
  const sel = $(id); const cur = sel.value;
  sel.innerHTML = `<option value="">${placeholder}</option>` + values.map(v=>`<option value="${v}">${v}</option>`).join("");
  if ([...sel.options].some(o=>o.value===cur)) sel.value = cur;
}
function uniqueFromCurrent(field, filter){
  const set = new Set();
  currentDataset().forEach(r=>{
    if (filter && !filter(r)) return;
    if (field === "planta"){ String(r.planta||"").split(",").map(p=>p.trim()).filter(Boolean).forEach(p=>set.add(p)); }
    else { const v = r[field]; if (v) set.add(v); }
  });
  return [...set].sort();
}
function applyFilters(){
  return currentDataset().filter(r=>{
    if (state.zona && r.zona !== state.zona) return false;
    if (state.entity){
      const name = state.view === "coord" ? r.coordinador : r.operador;
      if (name !== state.entity) return false;
    }
    if (state.planta && !String(r.planta||"").split(",").map(x=>x.trim()).includes(state.planta)) return false;
    if (state.semana && String(r.semana) !== String(state.semana)) return false;
    if (state.view === "op" && state.jefe && r.jefe !== state.jefe) return false;
    if (state.view === "op" && state.coordFilter && r.coordinador !== state.coordFilter) return false;
    if (state.search){
      const q = state.search.toLowerCase();
      const name = (state.view === "coord" ? r.coordinador : r.operador) || "";
      const inName = name.toLowerCase().includes(q);
      const inPlanta = String(r.planta||"").toLowerCase().includes(q);
      const inNom = state.view === "op" && String(r.nomina||"").includes(q);
      const inCoord = state.view === "op" && String(r.coordinador||"").toLowerCase().includes(q);
      if (!(inName||inPlanta||inNom||inCoord)) return false;
    }
    return true;
  });
}
function sortDesc(rows){
  return rows.slice().sort((a,b)=>{
    const sa = isNum(sortKey(a)) ? sortKey(a) : -Infinity;
    const sb = isNum(sortKey(b)) ? sortKey(b) : -Infinity;
    if (sb !== sa) return sb - sa;
    // Desempate: score de seguridad (mayor a menor)
    const seg_a = isNum(a.score_seg) ? a.score_seg : -Infinity;
    const seg_b = isNum(b.score_seg) ? b.score_seg : -Infinity;
    if (seg_b !== seg_a) return seg_b - seg_a;
    const na = (state.view==="coord"?a.coordinador:a.operador) || "";
    const nb = (state.view==="coord"?b.coordinador:b.operador) || "";
    return na.localeCompare(nb);
  });
}
function medal(pos){
  if (pos===1) return `<span class="rank-badge gold" aria-label="1er lugar">1</span>`;
  if (pos===2) return `<span class="rank-badge silver" aria-label="2do lugar">2</span>`;
  if (pos===3) return `<span class="rank-badge bronze" aria-label="3er lugar">3</span>`;
  return `<span class="rank-num">${pos}</span>`;
}
function zonaChip(z){ if(!z) return ""; return `<span class="zona-chip ${z==='Garcia'?'garcia':''}">${z}</span>`; }
function tipBtn(kind, id){
  const safeId = String(id).replace(/"/g,'&quot;');

}
function renderTable(filtered){
  const tb = $("tbody");
  const cols = state.view === "coord" ? COORD_COLS : OP_COLS;
  if (!filtered.length){ tb.innerHTML = `<tr><td colspan="${cols.length}" class="no-data">Sin resultados</td></tr>`; return; }
  const rows = [];

    const pos = i+1;

      rows.push(`<tr class="coord-row" data-coord="${(r.coordinador||'').replace(/"/g,'&quot;')}">
        <td class="pos">${medal(pos)}</td>
        <td class="coord">${r.coordinador}${tipBtn('coord', r.coordinador)}${zonaChip(r.zona)}</td>

        <td class="udn">${r.udn||"–"}</td>
        ${cellPct(r.ns_inicio)}${cellPct(r.ns_llegada)}${cellPct(r.calidad_ruta)}
        ${cellScore(r.score_seg)}${cellPct(r.pct_score_seg)}
        ${cellScore(r.rend_camion)}${cellScore(r.rend_camioneta)}
        ${cellPct(r.score_rend)}
        <td class="subtotal">${isNum(r.subtotal)?r.subtotal.toFixed(2)+"%":"–"}</td>
      </tr>`);
    } else {
      rows.push(`<tr>
        <td class="pos">${medal(pos)}</td>
        <td class="coord">${r.operador}${tipBtn('op-nomina', r.nomina)}${zonaChip(r.zona)}</td>
        <td class="nomina">${r.nomina||"–"}</td>
        <td class="planta" title="${(r.planta||'').replace(/"/g,'&quot;')}">${r.planta||"–"}</td>
        ${cellPct(r.ns_inicio)}${cellPct(r.ns_llegada)}${cellPct(r.calidad_ruta)}
        ${cellScore(r.score_seg)}${cellPct(r.pct_score_seg)}
        ${cellPct(r.rendimiento)}${cellPct(r.score_rend)}
        <td class="subtotal">${isNum(r.total)?r.total.toFixed(2)+"%":"–"}</td>
      </tr>`);
    }
  });
  tb.innerHTML = rows.join("");
}
function updateHighlights(){
  const ds = currentDataset().filter(r => {
    if (state.semana && String(r.semana) !== String(state.semana)) return false;
    if (state.zona && r.zona !== state.zona) return false;
    return true;
  });
  const key = state.view === "coord" ? "subtotal" : "total";
  const nameKey = state.view === "coord" ? "coordinador" : "operador";
  const with_ = ds.filter(r => isNum(r[key]));
  if (!with_.length){
    $("bestVal").textContent="—"; $("bestName").textContent="—"; $("bestUdn").textContent="—";
    $("worstVal").textContent="—"; $("worstName").textContent="—"; $("worstUdn").textContent="—";
    return;
  }
  const best = with_.reduce((a,b)=> a===null||b[key]>a[key]?b:a, null);
  const worst = with_.reduce((a,b)=> a===null||b[key]<a[key]?b:a, null);
  const label = state.view === "coord" ? "coordinador" : "operador";
  $("bestVal").textContent = best[key].toFixed(2)+"%";
  $("bestName").textContent = best[nameKey];
  $("bestUdn").textContent = state.view==="coord" ? (best.udn||"–") : `${best.planta||""} · ${best.coordinador||"—"}`;
  $("bestCap").textContent = "Mejor "+label;
  $("worstVal").textContent = worst[key].toFixed(2)+"%";
  $("worstName").textContent = worst[nameKey];
  $("worstUdn").textContent = state.view==="coord" ? (worst.udn||"–") : `${worst.planta||""} · ${worst.coordinador||"—"}`;
  $("worstCap").textContent = "Peor "+label;
}

  "score_seg": "Coaching de manejo por eventos (frenado brusco, aceleración, curvas).",
  "pct_score_seg": "Reforzar comportamientos seguros con coaching individualizado.",
  "rendimiento": "Manejo eficiente + revisión mecánica del vehículo (llantas, aire, ralentí).",
  "score_rend": "Alinear con meta 100: hábitos de aceleración/frenado y kilometraje efectivo.",
};
function badgeVal(v, m){ if (!isNum(v)) return "–"; return m.type === "pct" ? v.toFixed(2)+"%" : v.toFixed(2); }
function analyze(row, metrics){
  const strong = [], weak = [];
  metrics.forEach(m=>{
    const v = row[m.k];
    if (!isNum(v)) return;
    const ok = v >= m.target;
    const gap = Math.abs(v - m.target);
    if (ok) strong.push({m, v, gap});
    else weak.push({m, v, gap});
  });
  weak.sort((a,b)=>b.gap - a.gap);
  strong.sort((a,b)=>b.gap - a.gap);
  return {strong, weak};
}
function openTip(kind, id){
  let row = null, name = "", sub = "", headline = null;
  if (kind === "coord"){
    row = DATA.coords.find(c => c.coordinador === id);
    if (!row) return;
    name = row.coordinador;
    sub = `${row.planta||"–"} · ${row.zona||"–"} · Subtotal ${isNum(row.subtotal)?row.subtotal.toFixed(2)+"%":"–"}`;
    headline = row.subtotal;
    const {strong, weak} = analyze(row, METRICS_COORD);
    renderModal(name, sub, headline, weak, strong, "coord");
  } else if (kind === "op-nomina"){
    row = DATA.operators.find(o => String(o.nomina) === String(id));
    if (!row) return;
    name = row.operador;
    sub = `${row.nomina||"–"} · ${row.planta||"–"} · ${row.coordinador||"—"} · Total ${isNum(row.total)?row.total.toFixed(2)+"%":"–"}`;
    headline = row.total;
    const {strong, weak} = analyze(row, METRICS_OP);
    renderModal(name, sub, headline, weak, strong, "op");
  }
}
function renderModal(name, sub, headline, weak, strong, kind){
  $("mTitle").textContent = name;
  $("mSub").textContent = sub;
  const body = [];
  body.push(`<div class="score-hero"><div><div class="lbl">Calificación</div><div style="font-size:12px;color:var(--ink-2);margin-top:2px">${kind==="coord"?"Subtotal":"Total"} del período</div></div><div class="val">${isNum(headline)?headline.toFixed(2)+"%":"–"}</div></div>`);
  if (weak.length){
    body.push(`<div class="rec-section"><div class="rec-title bad">Áreas a mejorar</div>`);
    weak.forEach(w=>{
      const tip = TIPS[w.m.k] || "Establecer plan de acción.";
      body.push(`<div class="rec-item bad"><span class="metric">${w.m.label}</span><span class="val">${badgeVal(w.v, w.m)} · meta ${w.m.type==='pct'?w.m.target+'%':w.m.target}</span><span class="comment">${tip}</span></div>`);
    });
    body.push(`</div>`);
  } else {
    body.push(`<div class="rec-section"><div class="rec-title good">Áreas a mejorar</div><div class="rec-empty">Cumple todas las metas.</div></div>`);
  }
  if (strong.length){
    body.push(`<div class="rec-section"><div class="rec-title good">Lo que está bien</div>`);
    strong.slice(0,6).forEach(s=>{
      body.push(`<div class="rec-item good"><span class="metric">${s.m.label}</span><span class="val">${badgeVal(s.v, s.m)}</span></div>`);
    });
    body.push(`</div>`);
  }
  // Position in ranking
  const ds = kind === "coord" ? DATA.coords : DATA.operators;
  const key = kind === "coord" ? "subtotal" : "total";
  const nameKey = kind === "coord" ? "coordinador" : "operador";
  const sorted = ds.filter(r=>isNum(r[key])).sort((a,b)=>b[key]-a[key]);
  const pos = sorted.findIndex(r => r[nameKey] === name) + 1;
  if (pos > 0){
    const total = sorted.length;
    body.push(`<div class="rec-section"><div class="rec-title info">Posición en el ranking</div><div class="rec-item"><span class="metric">Posición ${pos} de ${total}</span><span class="val">Percentil ${Math.round((1-(pos-1)/total)*100)}%</span></div></div>`);
  }
  $("mBody").innerHTML = body.join("");
  $("modal").classList.add("open");
}

function fmtCell(v, type){
  if (!isNum(v)) return `<td class="num dash">–</td>`;
  const val = type==='pct' ? v.toFixed(2)+'%' : v.toFixed(2);
  return `<td class="num">${val}</td>`;
}

function openTop3Modal(coordName){
  const coord = DATA.coords.find(c => c.coordinador === coordName);
  if (!coord) return;
  const top3 = coord.top3 || [];
  $("mTitle").textContent = "Top 3 Operadores — " + coord.coordinador;
  $("mSub").textContent = `${coord.planta||"–"} · ${coord.zona||"–"} · Subtotal ${isNum(coord.subtotal)?coord.subtotal.toFixed(2)+"%":"–"}`;
  const body = [];
  if (!top3.length){
    body.push(`<div class="rec-empty">Sin operadores en el Top 3.</div>`);
  } else {
    body.push(`<div class="top3-table-wrap"><table class="top3-table">
      <thead><tr>
        <th>#</th>
        <th>Operador</th>
        <th>Planta</th>
        <th class="num">% NS Inicio</th>
        <th class="num">% NS Llegada</th>
        <th class="num">Calidad Ruta</th>
        <th class="num">Score Seg.</th>
        <th class="num">% Score Seg.</th>
        <th class="num">Rendimiento</th>
        <th class="num">Score Rend.</th>
        <th class="num total-col">Total</th>
      </tr></thead><tbody>`);
    top3.forEach((t, i) => {
      const rank = i + 1;
      const op = DATA.operators.find(o => String(o.nomina) === String(t.nomina)) || {};
      const badgeCls = rank===1?'gold':rank===2?'silver':'bronze';
      const total = isNum(t.total) ? Number(t.total).toFixed(2)+'%' : (t.total||'–');
      body.push(`<tr>
        <td class="rank-cell"><span class="rank-badge ${badgeCls}">${rank}</span></td>
        <td class="op-nm">${t.nombre}<span class="op-nom">Nómina ${t.nomina}</span></td>
        <td class="planta-cell">${t.planta||op.planta||"–"}</td>
        ${fmtCell(op.ns_inicio,'pct')}
        ${fmtCell(op.ns_llegada,'pct')}
        ${fmtCell(op.calidad_ruta,'pct')}
        ${fmtCell(op.score_seg,'num')}
        ${fmtCell(op.pct_score_seg,'pct')}
        ${fmtCell(op.rendimiento,'pct')}
        ${fmtCell(op.score_rend,'pct')}
        <td class="total-cell">${total}</td>
      </tr>`);
    });
    body.push(`</tbody></table></div>`);
  }
  $("mBody").innerHTML = body.join("");
  $("modal").classList.add("open");
}

function exportExcel(){
  if (typeof XLSX === "undefined"){
    alert("La librería de Excel no cargó. Verifica tu conexión a internet e intenta de nuevo.");
    return;
  }
  const filtered = sortDesc(applyFilters());
  if (!filtered.length){ alert("No hay datos para exportar con los filtros actuales."); return; }
  const isCoord = state.view === "coord";
  const header = isCoord
    ? ["#","Coordinador","Zona","Planta","UDN","% NS Inicio","% NS Llegada","Calidad Ruta","Score Seg.","% Score Seg.","Rend. Camión","Rend. Camioneta","Score Rend.","Subtotal","Semana"]
    : ["#","Operador","Nómina","Zona","Planta","% NS Inicio","% NS Llegada","Calidad Ruta","Score Seg.","% Score Seg.","Rendimiento","Score Rend.","Total","Semana"];
  const num = v => isNum(v) ? Number(v) : null;
  const aoa = [header];
  let dataRowCount = 0;
  if (isCoord){
    filtered.forEach((r,i)=>{
      aoa.push([i+1, r.coordinador||"", r.zona||"", r.planta||"", r.udn||"",
        num(r.ns_inicio), num(r.ns_llegada), num(r.calidad_ruta),
        num(r.score_seg), num(r.pct_score_seg),
        num(r.rend_camion), num(r.rend_camioneta), num(r.score_rend),
        num(r.subtotal), r.semana||""]);
      dataRowCount++;
      // Top 3 operadores del coordinador (anidados)
      const top3 = Array.isArray(r.top3) ? r.top3 : [];
      top3.forEach((t, ti) => {
        const op = DATA.operators.find(o => String(o.nomina) === String(t.nomina)) || {};
        const label = "   → Top " + (ti+1) + ": " + (t.nombre || "") + (t.nomina ? "  (Nómina " + t.nomina + ")" : "");
        aoa.push([
          "",                                      // #
          label,                                   // Coordinador (nombre del operador anidado)
          op.zona || r.zona || "",                 // Zona
          t.planta || op.planta || "",             // Planta
          "",                                      // UDN
          num(op.ns_inicio), num(op.ns_llegada), num(op.calidad_ruta),
          num(op.score_seg), num(op.pct_score_seg),
          null, null,                              // Rend. Camión / Camioneta (no aplica)
          num(op.score_rend),
          num(t.total != null ? t.total : op.total),
          op.semana || r.semana || ""
        ]);
        dataRowCount++;
      });
    });
  } else {
    filtered.forEach((r,i)=>{
      aoa.push([i+1, r.operador||"", r.nomina||"", r.zona||"", r.planta||"",
        num(r.ns_inicio), num(r.ns_llegada), num(r.calidad_ruta),
        num(r.score_seg), num(r.pct_score_seg),
        num(r.rendimiento), num(r.score_rend),
        num(r.total), r.semana||""]);
      dataRowCount++;
    });
  }
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  // Anchos de columna aproximados
  const widths = isCoord
    ? [5,52,10,32,10,12,12,12,12,14,14,16,12,12,10]
    : [5,30,10,10,32,12,12,12,12,14,14,12,10,10];
  ws["!cols"] = widths.map(w=>({wch:w}));
  ws["!freeze"] = { xSplit:0, ySplit:1 };
  ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:dataRowCount, c:header.length-1} }) };
  const wb = XLSX.utils.book_new();
  const sheetName = isCoord ? "Coordinadores" : "Operadores";
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  // Nombre de archivo con filtros y fecha
  const parts = ["Ranking_Garcia", isCoord ? "Coord" : "Op"];
  if (state.zona) parts.push(state.zona);
  if (state.semana) parts.push("S"+state.semana);
  const d = new Date();
  const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
  parts.push(stamp);
  XLSX.writeFile(wb, parts.join("_")+".xlsx");
}

function bind(){
  document.querySelectorAll("#viewSwitch button").forEach(b=>{
    b.addEventListener("click", ()=>{
      document.querySelectorAll("#viewSwitch button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
      state.view = b.dataset.view;
      state.entity = ""; state.jefe = ""; state.coordFilter = "";
      refreshFilters();
      $("fEntity").value=""; if ($("fJefe")) $("fJefe").value=""; if ($("fCoord")) $("fCoord").value="";
      render();
    });
  });
  $("fZona").addEventListener("change", e=>{ state.zona=e.target.value; refreshFilters(); syncTabs(); render(); });
  $("fEntity").addEventListener("change", e=>{ state.entity=e.target.value; render(); });
  $("fPlanta").addEventListener("change", e=>{ state.planta=e.target.value; render(); });
  $("fSemana").addEventListener("change", e=>{ state.semana=e.target.value; render(); });
  $("fJefe").addEventListener("change", e=>{ state.jefe=e.target.value; render(); });
  $("fCoord").addEventListener("change", e=>{ state.coordFilter=e.target.value; render(); });
  $("fSearch").addEventListener("input", e=>{ state.search=e.target.value; render(); });
  $("clearBtn").addEventListener("click", clearAll);
  $("resetBtn").addEventListener("click", clearAll);
  $("excelBtn").addEventListener("click", exportExcel);
  document.querySelectorAll("#zoneTabs .tab").forEach(t=>{
    t.addEventListener("click", ()=>{
      state.zona = t.dataset.zone; $("fZona").value = state.zona;
      syncTabs(); refreshFilters(); render();
    });
  });
  $("tbody").addEventListener("click", e=>{
    const tip = e.target.closest(".tip-btn");
    if (tip){ e.stopPropagation(); openTip(tip.dataset.tipKind, tip.dataset.tipId); return; }
    const row = e.target.closest("tr.coord-row");
    if (row && state.view === "coord"){
      openTop3Modal(row.dataset.coord);
    }
  });
  $("mobileMenuBtn").addEventListener("click", ()=>{
    document.querySelector(".sidebar").classList.add("open");
    $("sidebarBackdrop").classList.add("open");
  });
  $("sidebarBackdrop").addEventListener("click", ()=>{
    document.querySelector(".sidebar").classList.remove("open");
    $("sidebarBackdrop").classList.remove("open");
  });
  // Close sidebar when any filter changes on mobile
  document.querySelectorAll(".sidebar select, .sidebar input").forEach(el=>{
    el.addEventListener("change", ()=>{
      if (window.innerWidth <= 780){
        setTimeout(()=>{
          document.querySelector(".sidebar").classList.remove("open");
          $("sidebarBackdrop").classList.remove("open");
        }, 150);
      }
    });
  });
  $("mClose").addEventListener("click", ()=>$("modal").classList.remove("open"));
  $("modal").addEventListener("click", e=>{ if (e.target.id === "modal") $("modal").classList.remove("open"); });
  document.addEventListener("keydown", e=>{ if (e.key === "Escape") $("modal").classList.remove("open"); });
}
function clearAll(){
  state.zona=""; state.entity=""; state.planta=""; state.semana=""; state.jefe=""; state.coordFilter=""; state.search="";
  $("fZona").value=""; $("fSearch").value="";
  refreshFilters();
  $("fEntity").value=""; $("fPlanta").value=""; $("fSemana").value=""; if ($("fJefe")) $("fJefe").value=""; if ($("fCoord")) $("fCoord").value="";
  syncTabs(); render();
}

/* ===== NORMALIZACIÓN DE NOMBRES =====
   - Coordinadores / jefes: ya están en orden "Nombre Apellido"; solo title case.
   - Operadores: vienen como "APELLIDO APELLIDO NOMBRE(S)"; se reordenan a
     "Nombre(s) Apellido Apellido" y se aplica title case.
   - Se conserva el prefijo "C." cuando aparece (indica coordinador listado como operador).
*/
function titleCaseName(s){
  if (s === null || s === undefined) return s;
  const str = String(s).trim();
  if (!str) return str;
  return str.toLowerCase().replace(/(^|[\s\-\.\/'])(\p{L})/gu, (m, sep, ch) => sep + ch.toUpperCase());
}
function reorderOperatorName(raw){
  if (raw === null || raw === undefined) return raw;
  let s = String(raw).trim();
  if (!s) return s;
  // Detectar prefijo "C." o "C"
  let prefix = "";
  const pm = s.match(/^(C\.?)(?:\s+)(.+)$/i);
  if (pm){ prefix = "C."; s = pm[2].trim(); }
  const toks = s.split(/\s+/).filter(Boolean);
  let ordered;
  if (toks.length >= 3){
    const apellidos = toks.slice(0, 2);
    const nombres = toks.slice(2);
    ordered = nombres.concat(apellidos).join(" ");
  } else {
    ordered = toks.join(" ");
  }
  const titled = titleCaseName(ordered);
  return prefix ? (prefix + " " + titled) : titled;
}
(function normalizeAllNames(){
  if (Array.isArray(DATA.coords)){
    DATA.coords.forEach(c => {
      if (c.coordinador) c.coordinador = titleCaseName(c.coordinador);
      if (Array.isArray(c.top3)){
        c.top3.forEach(t => { if (t.nombre) t.nombre = reorderOperatorName(t.nombre); });
      }
    });
  }
  if (Array.isArray(DATA.operators)){
    DATA.operators.forEach(o => {
      if (o.operador) o.operador = reorderOperatorName(o.operador);
      if (o.coordinador) o.coordinador = titleCaseName(o.coordinador);
      if (o.jefe) o.jefe = titleCaseName(o.jefe);
    });
  }
})();

/* Dedupe defensivo: si por cualquier razón la misma (coord, semana) aparece
   más de una vez, colapsamos a una sola fila (nos quedamos con la primera). */
(function dedupeCoordsBySemana(){
  if (!Array.isArray(DATA.coords)) return;
  const seen = new Set();
  DATA.coords = DATA.coords.filter(c => {
    const k = (c.coordinador||"").trim().toLowerCase() + "|" + String(c.semana||"");
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
})();

/* Dedup DEFENSIVO de operadores: si por lo que sea llegan filas repetidas
   por nómina (una por semana), nos quedamos con la de la SEMANA MÁS RECIENTE. */
(function dedupeOperatorsByNomina(){
  if (!Array.isArray(DATA.operators)) return;
  const bestByNom = new Map();
  DATA.operators.forEach(o => {
    const nom = String(o.nomina || "").trim();
    if (!nom) return;
    const prev = bestByNom.get(nom);
    const sem = Number(o.semana) || 0;
    const prevSem = prev ? (Number(prev.semana) || 0) : -1;
    if (!prev || sem > prevSem) bestByNom.set(nom, o);
  });
  DATA.operators = [...bestByNom.values()];
})();

/* Semana por defecto = la más reciente disponible en los datos */
(function setDefaultSemana(){
  const sems = [...new Set(DATA.coords.map(c=>Number(c.semana)).filter(v=>!isNaN(v)))];
  if (sems.length){
    const maxSem = Math.max(...sems);
    state.semana = String(maxSem);
  }
})();

refreshFilters();
try { if (state.semana && $("fSemana")) $("fSemana").value = state.semana; } catch(e){}
bind();
render();
</script>
