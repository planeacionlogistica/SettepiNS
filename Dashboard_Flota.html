<script>
// ==================== DATOS ====================
const UMBRAL_AHORRO = 13;
let DATOS = { /* Tu JSON completo va aquí */ 
  "ops": [ /* ... pega aquí todo el array de ops que tenías ... */ ],
  "udns": ["Settepi Garcia"]
};

// ==================== FUNCIONES BÁSICAS ====================
function haversine(lat1,lon1,lat2,lon2){ /* tu función original */ 
  const R=6371; const toRad = x => x*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function escapeHTML(str){ return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }

// ==================== RUTAS POR CALLES ====================
async function getRoute(lat1, lon1, lat2, lon2) {
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${lon1},${lat1};${lon2},${lat2}?geometries=polyline&overview=full`;
    const response = await fetch(url);
    const data = await response.json();
    if (data.code === "Ok" && data.routes?.[0]) {
      return L.Polyline.fromEncoded(data.routes[0].geometry).getLatLngs();
    }
  } catch(e) {}
  return [[lat1,lon1], [lat2,lon2]]; // fallback
}

// ==================== MAPA ====================
let modalMapa = null;
let modalLayer = null;

async function pintarMapaModal(s) {
  if (!modalLayer) return;
  modalLayer.clearLayers();
  const {A, B} = s;

  const [rutaActualA, rutaActualB, rutaNuevaA, rutaNuevaB] = await Promise.all([
    getRoute(A.olat, A.olon, A.plat, A.plon),
    getRoute(B.olat, B.olon, B.plat, B.plon),
    getRoute(A.olat, A.olon, B.plat, B.plon),
    getRoute(B.olat, B.olon, A.plat, A.plon)
  ]);

  L.polyline(rutaActualA, {color: '#dc2626', weight: 4, dashArray: '8,5'}).addTo(modalLayer);
  L.polyline(rutaActualB, {color: '#dc2626', weight: 4, dashArray: '8,5'}).addTo(modalLayer);
  L.polyline(rutaNuevaA, {color: '#65a30d', weight: 5}).addTo(modalLayer);
  L.polyline(rutaNuevaB, {color: '#65a30d', weight: 5}).addTo(modalLayer);

  // Marcadores (simplificado)
  L.marker([A.olat, A.olon]).bindPopup("Hogar A").addTo(modalLayer);
  L.marker([B.olat, B.olon]).bindPopup("Hogar B").addTo(modalLayer);
  L.marker([A.plat, A.plon]).bindPopup("Ruta A").addTo(modalLayer);
  L.marker([B.plat, B.plon]).bindPopup("Ruta B").addTo(modalLayer);

  modalMapa.fitBounds([[A.olat,A.olon],[B.olat,B.olon],[A.plat,A.plon],[B.plat,B.plon]], {padding: [50,50]});
}

// ==================== INICIALIZACIÓN ====================
function init() {
  const fileInput = document.getElementById('file-input');
  document.getElementById('btn-upload').onclick = () => fileInput.click();
  fileInput.onchange = e => {
    if (e.target.files[0]) cargarArchivo(e.target.files[0]);
  };

  document.getElementById('btn-recalc').onclick = () => calcularSwaps();

  // Modal
  document.getElementById('modal-close').onclick = () => document.getElementById('modal-bd').classList.remove('show');

  // Iniciar cálculo
  calcularSwaps();
}

window.onload = init;
</script>
